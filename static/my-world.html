<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>我的世界 — Martin</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#c6e9ef;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button{font:inherit;cursor:pointer;border:1px solid #ffffffa8;border-radius:20px;background:#fff9;color:#526453;padding:12px 18px;backdrop-filter:blur(8px);touch-action:none}header{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}header>*{pointer-events:auto}.title{color:#50664c;font-size:20px;letter-spacing:3px}.title small{display:block;font-size:11px;letter-spacing:1px;margin-top:5px}#entry{position:fixed;inset:0;background:#e9f4ee88;display:grid;place-items:center;backdrop-filter:blur(5px)}#entry[hidden]{display:none}.card{background:#fffffff0;border-radius:28px;padding:34px;width:min(340px,88vw);text-align:center;box-shadow:0 18px 70px #68897726}.card h1{font-size:30px;color:#57704e;letter-spacing:5px}.card p{font-size:14px;color:#718271;line-height:1.8}.card input{width:100%;border:1px solid #d8e4d1;background:#fafcf8;border-radius:14px;padding:13px;font:16px Arial;margin:10px 0 18px}.card button{background:#e1edcf;width:100%}#stick{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:max(35px,env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #ffffffbd;background:#fff3;border-radius:50%;touch-action:none}#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:#fffc;transform:translate(-50%,-50%);pointer-events:none}#jump{position:fixed;right:28px;bottom:48px;width:74px;height:74px;border-radius:50%}#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);color:#49644b;font-size:12px;white-space:nowrap;pointer-events:none}#notice{position:fixed;top:90px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:18px;background:#fff9;color:#597157;font-size:13px;pointer-events:none;transition:opacity .3s}@media(pointer:coarse){#hint{display:none}}@media(pointer:fine){#stick{opacity:.65}}
.title{background:#fff9;padding:12px 16px;border-radius:18px}</style></head><body><canvas id="view"></canvas><header><div class="title">我的世界<small>EXPLORE YOUR WORLD</small></div><button id="leave">返回电脑</button></header><div id="notice">正在准备小世界…</div><div id="stick"><span id="knob"></span></div><button id="jump">跳跃</button><p id="hint">WASD 移动 · Shift 跑步 · 空格跳跃 · 拖动看四周</p><form id="entry"><div class="card"><h1>我的世界</h1><p>走进方块世界，<br>沿着地形自由探索。</p><input id="nickname" aria-label="昵称" placeholder="给自己取个昵称" maxlength="24" required><button id="enter" disabled>正在准备…</button></div></form><script type="module" src="/static/my-world.js"></script></body></html>
