<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White World — Martin</title><link rel="stylesheet" href="/static/world.css"></head>
<body>
<section id="entry"><a href="/">← Home</a><form id="join"><p>EARTH / WHITE WORLD</p><h1>A world starts<br>with you.</h1><label for="nickname">Your nickname</label><input id="nickname" maxlength="24" autocomplete="nickname" required><button>Enter the world →</button><p id="entryError" role="alert"></p></form></section>
<section id="world" hidden><canvas id="view" tabindex="0" aria-label="First person world. Use WASD or arrow keys to walk."></canvas><div class="top"><span id="identity"></span><span id="status">Connecting…</span><button id="leave">Leave world</button></div><div id="crosshair">+</div><button id="look">Click to look around</button><p class="help">WASD / arrows to walk · Mouse to look · Esc to release · Enter to chat</p><div id="chat"><ol id="messages" aria-live="polite"></ol><form id="send"><input id="message" placeholder="Say something…" maxlength="240" aria-label="Chat message" required><button>Send</button></form><p id="chatError" role="alert"></p></div><div id="touch"><button data-key="w">↑</button><div><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div></div></section>
<script>window.worldToken = {{ csrf_token|tojson }};</script><script type="module" src="/static/world.js"></script></body></html>
