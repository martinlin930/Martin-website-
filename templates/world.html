<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japan Village — Martin</title><link rel="stylesheet" href="/static/world.css"></head>
<body>
<section id="entry"><a href="/">← Home</a><form id="join"><p>EARTH / JAPAN VILLAGE</p><h1>A world starts<br>with you.</h1><label for="nickname">Your nickname</label><input id="nickname" maxlength="24" autocomplete="nickname" value="{{ saved_game.nickname if saved_game else '' }}" required><button>Enter the world →</button>{% if session.get('user_id') %}<p>登录账户：{{ session['username'] }} · 游戏进度自动保存</p>{% else %}<p>访客进度不会保存。<a href="/login">登录</a> 或 <a href="/register">注册</a> 后可保留游戏进度。</p>{% endif %}<p id="entryError" role="alert"></p></form></section>
<section id="world" hidden><canvas id="view" tabindex="0" aria-label="First person world. Drag the joystick to walk."></canvas><div class="top"><span id="identity"></span><span id="saveStatus" role="status"></span><span id="worldClock" aria-label="Game time"></span><span id="status">Connecting…</span><button id="music" aria-label="Toggle village music">音乐</button><button id="leave">Leave world</button></div><div id="crosshair">+</div><button id="look">Click to look around</button><p class="help">Push joystick fully to run · Shift to run · Space to jump · Drag to look</p><div id="chat"><ol id="messages" aria-live="polite"></ol><form id="send"><input id="message" placeholder="Say something…" maxlength="2000" aria-label="Chat message" required><button>Send</button></form><p id="chatError" role="alert"></p></div><button id="jump" aria-label="Jump">跳跃</button><div id="joystick" role="group" aria-label="Drag joystick to walk"><span id="joystickKnob"></span></div></section>
<script>window.worldMusicMuted = {{ (saved_game.music_muted if saved_game else false)|tojson }}; window.worldAccount = {{ (session.get('user_id') is not none)|tojson }}; window.worldToken = {{ csrf_token|tojson }};</script><script type="module" src="/static/world.js"></script></body></html>
