<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Martin Photography</title>

    <meta
        name="description"
        content="Martin Photography — Moments through my perspective."
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Outfit:wght@800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --paper: #f3f3ee;
            --ink: #0b0b0b;
            --gutter: clamp(22px, 3vw, 44px);

            --display:
                "Outfit",
                "Arial Black",
                system-ui,
                sans-serif;

            --body:
                "Inter Tight",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: var(--paper);
        }


        body {
            font-family: var(--body);

            color: var(--ink);

            -webkit-font-smoothing: antialiased;

            overflow-x: hidden;
        }


        .hero {
            position: relative;

            width: 100%;

            height: 100vh;
            height: 100svh;

            min-height: 540px;

            overflow: hidden;

            background: var(--paper);

            isolation: isolate;

            touch-action: pan-y;
        }


        /* =========================
           PHOTO UNDER THE PAPER
        ========================= */

        .hero__photo {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            z-index: 0;

            pointer-events: none;

            background: var(--paper);
        }


        /* =========================
           FALLBACK PAPER
        ========================= */

        .hero__paper {
            position: absolute;

            inset: 0;

            z-index: 1;

            background: var(--paper);

            display: grid;

            place-items: center;
        }


        .hero__title {
            margin: 0;

            font-family: var(--display);

            font-weight: 800;

            font-size: 18vw;

            line-height: 1;

            letter-spacing: -0.055em;

            color: var(--ink);

            white-space: nowrap;

            user-select: none;
        }


        .hero.gl-on .hero__paper {
            background: transparent;
        }


        .hero.gl-on .hero__title {
            color: transparent;
        }


        /* =========================
           WEBGL CANVAS
        ========================= */

        .hero__reveal {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: none;

            display: block;
        }


        /* =========================
           UI
        ========================= */

        .chrome {
            position: absolute;

            inset: 0;

            z-index: 3;

            padding: var(--gutter);

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            pointer-events: none;

            mix-blend-mode: difference;

            color: #ffffff;
        }


        .chrome a {
            pointer-events: auto;
        }


        .intro__lede {
            margin: 0;

            font-size: clamp(18px, 1.6vw, 26px);

            line-height: 1.03;

            letter-spacing: -0.025em;

            font-weight: 400;
        }


        /* =========================
           CTA
        ========================= */

        .cta {
            display: inline-flex;

            align-items: center;

            gap: 13px;

            margin-top: 28px;

            padding: 14px 21px 14px 23px;

            border-radius: 999px;

            background: #ffffff;

            color: #000000;

            font:
                500 12px/1
                var(--body);

            letter-spacing: 0.07em;

            text-transform: uppercase;

            text-decoration: none;

            transition:
                transform .35s
                cubic-bezier(.2,.8,.2,1);
        }


        .cta svg {
            width: 15px;
            height: 15px;

            transition:
                transform .35s
                cubic-bezier(.2,.8,.2,1);
        }


        .cta:hover svg {
            transform: translateX(3px);
        }


        .cta:active {
            transform: scale(.97);
        }


        /* =========================
           BOTTOM
        ========================= */

        .foot {
            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            gap: 20px;

            font-size: 12px;

            line-height: 1.2;
        }


        .links {
            display: flex;

            align-items: center;

            gap: 10px;

            font-weight: 500;

            letter-spacing: 0.06em;

            text-transform: uppercase;
        }


        .links a {
            color: inherit;

            text-decoration: none;
        }


        .links a:hover {
            text-decoration: underline;

            text-underline-offset: 4px;
        }


        /* =========================
           HINT
        ========================= */

        .hint {
            position: absolute;

            left: 50%;

            bottom: calc(var(--gutter) + 2px);

            transform: translateX(-50%);

            margin: 0;

            font-size: 11px;

            letter-spacing: 0.08em;

            text-transform: uppercase;

            opacity: .45;

            transition: opacity .6s ease;

            white-space: nowrap;
        }


        .hint.is-gone {
            opacity: 0;
        }


        .hint .touch {
            display: none;
        }


        @media (hover: none) {

            .hint .mouse {
                display: none;
            }


            .hint .touch {
                display: inline;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 767px) {

            :root {
                --gutter: 30px;
            }


            html,
            body {
                background: var(--paper);
            }


            .hero {
                height: 100svh;

                min-height: 620px;

                background: var(--paper);
            }


            .hero__photo {
                object-fit: cover;

                object-position: center;
            }


            .intro__lede {
                font-size: 27px;

                line-height: 1.02;
            }


            .cta {
                margin-top: 30px;

                padding: 17px 28px;

                font-size: 13px;
            }


            .foot {
                font-size: 11px;
            }


            .links {
                font-size: 11px;
            }


            .hint {
                bottom: calc(
                    var(--gutter) + 28px
                );
            }

        }


        @media (max-width: 520px) {

            .foot {
                gap: 12px;
            }


            .links {
                gap: 8px;
            }

        }

    </style>
</head>


<body>


<section
    class="hero"
    id="hero"
    aria-label="Martin Photography"
>


    <!-- YOUR PHOTO UNDER THE PAPER -->

    <img
        class="hero__photo"
        id="heroPhoto"
        src="/static/images/DSC00686-2.JPG"
        alt=""
        aria-hidden="true"
    >


    <!-- FALLBACK PAPER -->

    <div class="hero__paper">

        <h1
            class="hero__title"
            id="heroTitle"
        >
            MARTIN
        </h1>

    </div>


    <!-- LIQUID REVEAL -->

    <canvas
        class="hero__reveal"
        id="heroReveal"
        aria-hidden="true"
    ></canvas>


    <!-- UI -->

    <div class="chrome">


        <div class="intro">

            <p class="intro__lede">
                Martin Photography.<br>
                Moments through my perspective.
            </p>


            <a
                class="cta"
                href="/work"
            >

                View my work

                <svg
                    viewBox="0 0 16 16"
                    fill="none"
                    aria-hidden="true"
                >

                    <path
                        d="M2 8h11m0 0L8.5 3.5M13 8l-4.5 4.5"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />

                </svg>

            </a>

        </div>


        <div class="foot">

            <span>
                Photographer — Martin
            </span>


            <nav
                class="links"
                aria-label="Social"
            >

                <a href="#">
                    Instagram
                </a>

                <span aria-hidden="true">
                    /
                </span>

                <a href="#">
                    Contact
                </a>

            </nav>

        </div>


        <p
            class="hint"
            id="hint"
            aria-hidden="true"
        >

            <span class="mouse">
                Move to reveal
            </span>

            <span class="touch">
                Touch to reveal
            </span>

        </p>


    </div>


</section>


<script>

(() => {

    /* =========================
       ELEMENTS
    ========================= */

    const hero =
        document.getElementById("hero");

    const canvas =
        document.getElementById("heroReveal");

    const hint =
        document.getElementById("hint");


    /* =========================
       CONSTANTS
    ========================= */

    const PAPER = [
        0xf3 / 255,
        0xf3 / 255,
        0xee / 255
    ];


    const INK = [
        0x0b / 255,
        0x0b / 255,
        0x0b / 255
    ];


    const TRAIL_SCALE =
        0.35;


    const DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const reduceMotion =
        window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;


    /* =========================
       SIZE
    ========================= */

    let W = 1;

    let H = 1;


    let baseRadius = 60;


    /* =========================
       OFFSCREEN CANVASES
    ========================= */

    const textCanvas =
        document.createElement("canvas");


    const textCtx =
        textCanvas.getContext("2d");


    const trailCanvas =
        document.createElement("canvas");


    const trailCtx =
        trailCanvas.getContext("2d");


    /* =========================
       POINTER
    ========================= */

    const pointer = {

        active: false,

        x: 0,
        y: 0,

        px: 0,
        py: 0,

        vx: 0,
        vy: 0

    };


    let droplets = [];


    let lastMove =
        performance.now();


    /* =========================
       HELPERS
    ========================= */

    function clamp(
        value,
        min,
        max
    ) {

        return Math.max(
            min,
            Math.min(
                max,
                value
            )
        );

    }


    /* =========================
       TRAIL STAMP
    ========================= */

    function stamp(
        x,
        y,
        radius,
        vx,
        vy,
        alpha
    ) {

        const sx =
            x * TRAIL_SCALE;


        const sy =
            y * TRAIL_SCALE;


        const sr =
            Math.max(
                1,
                radius *
                TRAIL_SCALE
            );


        const k =
            0.012;


        const red =
            Math.round(

                128 +

                clamp(
                    vx * k,
                    -1,
                    1
                ) *

                127

            );


        const green =
            Math.round(

                128 +

                clamp(
                    vy * k,
                    -1,
                    1
                ) *

                127

            );


        const gradient =
            trailCtx.createRadialGradient(

                sx,
                sy,
                0,

                sx,
                sy,
                sr

            );


        gradient.addColorStop(

            0,

            `rgba(
                ${red},
                ${green},
                0,
                ${alpha}
            )`

        );


        gradient.addColorStop(

            0.5,

            `rgba(
                ${red},
                ${green},
                0,
                ${alpha * .85}
            )`

        );


        gradient.addColorStop(

            1,

            `rgba(
                ${red},
                ${green},
                0,
                0
            )`

        );


        trailCtx.fillStyle =
            gradient;


        trailCtx.beginPath();


        trailCtx.arc(
            sx,
            sy,
            sr,
            0,
            Math.PI * 2
        );


        trailCtx.fill();

    }


    /* =========================
       UPDATE TRAIL
    ========================= */

    function updateTrail(dt) {

        const frame =
            dt * 60;


        /*
        fade old trail
        */

        trailCtx.globalCompositeOperation =
            "destination-out";


        trailCtx.fillStyle =
            `rgba(
                0,
                0,
                0,
                ${
                    1 -
                    Math.pow(
                        1 - 0.03,
                        frame
                    )
                }
            )`;


        trailCtx.fillRect(

            0,
            0,

            trailCanvas.width,
            trailCanvas.height

        );


        trailCtx.globalCompositeOperation =
            "source-over";


        /*
        pointer stroke
        */

        if (
            pointer.active
        ) {

            const dx =
                pointer.x -
                pointer.px;


            const dy =
                pointer.y -
                pointer.py;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance >
                0.5
            ) {

                pointer.vx +=

                    (
                        dx /
                        Math.max(
                            frame,
                            0.001
                        ) -

                        pointer.vx
                    ) *

                    0.5;


                pointer.vy +=

                    (
                        dy /
                        Math.max(
                            frame,
                            0.001
                        ) -

                        pointer.vy
                    ) *

                    0.5;


                const speed =
                    Math.hypot(

                        pointer.vx,

                        pointer.vy

                    );


                const radius =

                    baseRadius *

                    (
                        0.75 +

                        Math.min(
                            speed / 45,
                            1
                        ) *

                        0.75
                    );


                const steps =
                    Math.max(

                        1,

                        Math.ceil(

                            distance /

                            (
                                radius *
                                0.22
                            )

                        )

                    );


                for (
                    let i = 1;
                    i <= steps;
                    i++
                ) {

                    const t =
                        i / steps;


                    stamp(

                        pointer.px +
                        dx * t,

                        pointer.py +
                        dy * t,

                        radius,

                        pointer.vx * 6,

                        pointer.vy * 6,

                        0.92

                    );

                }


                /*
                droplets
                */

                if (
                    !reduceMotion
                ) {

                    const count =
                        Math.min(

                            3,

                            Math.floor(
                                speed / 14
                            )

                        );


                    for (
                        let i = 0;
                        i < count;
                        i++
                    ) {

                        const angle =

                            Math.atan2(

                                pointer.vy,

                                pointer.vx

                            ) +

                            (
                                Math.random() -
                                0.5
                            ) *

                            1.4;


                        const dropSpeed =

                            speed *

                            (
                                0.35 +
                                Math.random() *
                                0.45
                            );


                        droplets.push({

                            x:

                                pointer.x +

                                (
                                    Math.random() -
                                    0.5
                                ) *

                                radius,


                            y:

                                pointer.y +

                                (
                                    Math.random() -
                                    0.5
                                ) *

                                radius,


                            vx:

                                Math.cos(
                                    angle
                                ) *

                                dropSpeed,


                            vy:

                                Math.sin(
                                    angle
                                ) *

                                dropSpeed,


                            radius:

                                radius *

                                (
                                    0.20 +
                                    Math.random() *
                                    0.35
                                ),


                            life: 1

                        });

                    }


                    if (
                        droplets.length >
                        90
                    ) {

                        droplets.splice(

                            0,

                            droplets.length -
                            90

                        );

                    }

                }


                pointer.px =
                    pointer.x;


                pointer.py =
                    pointer.y;

            }

            else {

                pointer.vx *=
                    0.8;


                pointer.vy *=
                    0.8;

            }

        }


        /*
        update droplets
        */

        for (
            let i =
                droplets.length - 1;

            i >= 0;

            i--
        ) {

            const drop =
                droplets[i];


            drop.x +=
                drop.vx *
                frame;


            drop.y +=
                drop.vy *
                frame;


            drop.vx *=
                Math.pow(
                    0.90,
                    frame
                );


            drop.vy =

                drop.vy *

                Math.pow(
                    0.90,
                    frame
                ) +

                0.25 *
                frame;


            drop.life -=
                0.022 *
                frame;


            drop.radius *=
                Math.pow(
                    0.985,
                    frame
                );


            if (

                drop.life <=
                0

                ||

                drop.radius <
                2

            ) {

                droplets.splice(
                    i,
                    1
                );


                continue;

            }


            stamp(

                drop.x,

                drop.y,

                drop.radius,

                drop.vx * 6,

                drop.vy * 6,

                0.85 *
                drop.life

            );

        }

    }


    /* =========================
       POINTER INPUT
    ========================= */

    function onMove(
        x,
        y
    ) {

        if (
            !pointer.active
        ) {

            pointer.active =
                true;


            pointer.x =
                x;


            pointer.y =
                y;


            pointer.px =
                x;


            pointer.py =
                y;

        }

        else {

            pointer.x =
                x;


            pointer.y =
                y;

        }


        lastMove =
            performance.now();


        hint.classList.add(
            "is-gone"
        );


        wake();

    }


    hero.addEventListener(

        "pointermove",

        event => {

            if (
                event.pointerType ===
                "touch"
            ) {

                return;

            }


            const rect =
                hero.getBoundingClientRect();


            onMove(

                event.clientX -
                rect.left,

                event.clientY -
                rect.top

            );

        }

    );


    hero.addEventListener(

        "pointerleave",

        event => {

            if (
                event.pointerType !==
                "touch"
            ) {

                pointer.active =
                    false;

            }

        }

    );


    /* =========================
       TOUCH
    ========================= */

    hero.addEventListener(

        "touchstart",

        event => {

            const touch =
                event.touches[0];


            if (
                !touch
            ) {

                return;

            }


            const rect =
                hero.getBoundingClientRect();


            const x =

                touch.clientX -
                rect.left;


            const y =

                touch.clientY -
                rect.top;


            pointer.active =
                true;


            pointer.x =
                pointer.px =
                x;


            pointer.y =
                pointer.py =
                y;


            stamp(

                x,

                y,

                baseRadius *
                1.1,

                0,

                0,

                0.95

            );


            lastMove =
                performance.now();


            hint.classList.add(
                "is-gone"
            );


            wake();

        },

        {
            passive: true
        }

    );


    hero.addEventListener(

        "touchmove",

        event => {

            const touch =
                event.touches[0];


            if (
                !touch
            ) {

                return;

            }


            const rect =
                hero.getBoundingClientRect();


            onMove(

                touch.clientX -
                rect.left,

                touch.clientY -
                rect.top

            );

        },

        {
            passive: true
        }

    );


    hero.addEventListener(

        "touchend",

        () => {

            pointer.active =
                false;

        },

        {
            passive: true
        }

    );


    /* =========================
       WEBGL
    ========================= */

    const gl =
        canvas.getContext(

            "webgl",

            {
                premultipliedAlpha: true,

                alpha: true,

                antialias: false,

                depth: false
            }

        );


    if (
        !gl
    ) {

        console.warn(
            "WebGL not available"
        );


        return;

    }


    /* =========================
       VERTEX SHADER
    ========================= */

    const vertexSource = `

        attribute vec2 aPos;

        varying vec2 vUv;


        void main() {

            vUv = vec2(

                aPos.x * .5 + .5,

                .5 - aPos.y * .5

            );


            gl_Position =
                vec4(
                    aPos,
                    0.0,
                    1.0
                );

        }

    `;


    /* =========================
       FRAGMENT SHADER
    ========================= */

    const fragmentSource = `

        precision highp float;


        varying vec2 vUv;


        uniform sampler2D uText;

        uniform sampler2D uTrail;

        uniform vec2 uRes;

        uniform vec3 uPaper;

        uniform vec3 uInk;

        uniform float uTime;


        float hash(vec2 p) {

            return fract(

                sin(

                    dot(

                        p,

                        vec2(
                            127.1,
                            311.7
                        )

                    )

                ) *

                43758.5453123

            );

        }


        float noise(vec2 p) {

            vec2 i =
                floor(p);


            vec2 f =
                fract(p);


            f =
                f *
                f *
                (
                    3.0 -
                    2.0 *
                    f
                );


            float a =
                hash(i);


            float b =
                hash(
                    i +
                    vec2(
                        1.0,
                        0.0
                    )
                );


            float c =
                hash(
                    i +
                    vec2(
                        0.0,
                        1.0
                    )
                );


            float d =
                hash(
                    i +
                    vec2(
                        1.0,
                        1.0
                    )
                );


            return mix(

                mix(
                    a,
                    b,
                    f.x
                ),

                mix(
                    c,
                    d,
                    f.x
                ),

                f.y

            );

        }


        void main() {

            vec2 uv =
                vUv;


            vec2 aspect =
                vec2(
                    uRes.x /
                    uRes.y,
                    1.0
                );


            float n1 =

                noise(

                    uv *
                    aspect *
                    4.0 +

                    vec2(
                        uTime *
                        .18,
                        0.0
                    )

                ) -

                .5;


            float n2 =

                noise(

                    uv *
                    aspect *
                    4.0 +

                    vec2(
                        12.7,
                        uTime *
                        .20
                    )

                ) -

                .5;


            vec2 wobble =

                vec2(
                    n1,
                    n2
                ) *

                .022;


            vec4 trail =

                texture2D(

                    uTrail,

                    uv +
                    wobble

                );


            float edgeNoise =

                (

                    noise(

                        uv *
                        aspect *
                        13.0 +

                        uTime *
                        .15

                    ) -

                    .5

                ) *

                .10;


            float mask =

                trail.a +
                edgeNoise;


            float hole =

                smoothstep(

                    .38,

                    .48,

                    mask

                );


            /*
            velocity encoded in red / green
            */

            vec2 velocity =

                (
                    trail.rg -
                    .5
                ) *

                2.0;


            float drag =

                smoothstep(

                    .03,

                    .42,

                    trail.a

                );


            vec2 smearUv =

                uv -

                velocity *

                drag *

                vec2(

                    .11 /

                    aspect.x,

                    .11

                );


            float textAlpha =

                texture2D(

                    uText,

                    smearUv

                ).a;


            vec3 colour =

                mix(

                    uPaper,

                    uInk,

                    textAlpha

                );


            float alpha =

                1.0 -
                hole;


            gl_FragColor =

                vec4(

                    colour *
                    alpha,

                    alpha

                );

        }

    `;


    /* =========================
       SHADER COMPILE
    ========================= */

    function createShader(
        type,
        source
    ) {

        const shader =
            gl.createShader(
                type
            );


        gl.shaderSource(
            shader,
            source
        );


        gl.compileShader(
            shader
        );


        if (

            !gl.getShaderParameter(

                shader,

                gl.COMPILE_STATUS

            )

        ) {

            console.error(

                gl.getShaderInfoLog(
                    shader
                )

            );

        }


        return shader;

    }


    const program =
        gl.createProgram();


    gl.attachShader(

        program,

        createShader(

            gl.VERTEX_SHADER,

            vertexSource

        )

    );


    gl.attachShader(

        program,

        createShader(

            gl.FRAGMENT_SHADER,

            fragmentSource

        )

    );


    gl.linkProgram(
        program
    );


    if (

        !gl.getProgramParameter(

            program,

            gl.LINK_STATUS

        )

    ) {

        console.error(

            gl.getProgramInfoLog(
                program
            )

        );


        return;

    }


    gl.useProgram(
        program
    );


    /* =========================
       FULLSCREEN QUAD
    ========================= */

    const buffer =
        gl.createBuffer();


    gl.bindBuffer(

        gl.ARRAY_BUFFER,

        buffer

    );


    gl.bufferData(

        gl.ARRAY_BUFFER,

        new Float32Array([

            -1, -1,

             1, -1,

            -1,  1,

             1,  1

        ]),

        gl.STATIC_DRAW

    );


    const position =
        gl.getAttribLocation(

            program,

            "aPos"

        );


    gl.enableVertexAttribArray(
        position
    );


    gl.vertexAttribPointer(

        position,

        2,

        gl.FLOAT,

        false,

        0,

        0

    );


    /* =========================
       TEXTURES
    ========================= */

    function createTexture(unit) {

        const texture =
            gl.createTexture();


        gl.activeTexture(

            gl.TEXTURE0 +
            unit

        );


        gl.bindTexture(

            gl.TEXTURE_2D,

            texture

        );


        gl.texParameteri(

            gl.TEXTURE_2D,

            gl.TEXTURE_WRAP_S,

            gl.CLAMP_TO_EDGE

        );


        gl.texParameteri(

            gl.TEXTURE_2D,

            gl.TEXTURE_WRAP_T,

            gl.CLAMP_TO_EDGE

        );


        gl.texParameteri(

            gl.TEXTURE_2D,

            gl.TEXTURE_MIN_FILTER,

            gl.LINEAR

        );


        gl.texParameteri(

            gl.TEXTURE_2D,

            gl.TEXTURE_MAG_FILTER,

            gl.LINEAR

        );


        return texture;

    }


    const textTexture =
        createTexture(0);


    const trailTexture =
        createTexture(1);


    gl.uniform1i(

        gl.getUniformLocation(

            program,

            "uText"

        ),

        0

    );


    gl.uniform1i(

        gl.getUniformLocation(

            program,

            "uTrail"

        ),

        1

    );


    gl.uniform3fv(

        gl.getUniformLocation(

            program,

            "uPaper"

        ),

        PAPER

    );


    gl.uniform3fv(

        gl.getUniformLocation(

            program,

            "uInk"

        ),

        INK

    );


    const resolutionUniform =
        gl.getUniformLocation(

            program,

            "uRes"

        );


    const timeUniform =
        gl.getUniformLocation(

            program,

            "uTime"

        );


    gl.enable(
        gl.BLEND
    );


    gl.blendFunc(

        gl.ONE,

        gl.ONE_MINUS_SRC_ALPHA

    );


    hero.classList.add(
        "gl-on"
    );


    /* =========================
       DRAW MARTIN TEXT
    ========================= */

    function drawTextTexture() {

        textCtx.clearRect(

            0,
            0,

            textCanvas.width,
            textCanvas.height

        );


        textCtx.setTransform(

            DPR,
            0,
            0,
            DPR,
            0,
            0

        );


        const maxWidth =
            W * .90;


        let fontSize =
            Math.min(

                W * .23,

                H * .32

            );


        textCtx.font =
            `800 ${fontSize}px Outfit, "Arial Black", sans-serif`;


        let measured =
            textCtx.measureText(
                "MARTIN"
            );


        if (
            measured.width >
            maxWidth
        ) {

            fontSize *=

                maxWidth /

                measured.width;


            textCtx.font =
                `800 ${fontSize}px Outfit, "Arial Black", sans-serif`;

        }


        textCtx.textAlign =
            "center";


        textCtx.textBaseline =
            "middle";


        textCtx.fillStyle =
            "#ffffff";


        textCtx.fillText(

            "MARTIN",

            W / 2,

            H / 2

        );


        gl.activeTexture(
            gl.TEXTURE0
        );


        gl.bindTexture(

            gl.TEXTURE_2D,

            textTexture

        );


        gl.texImage2D(

            gl.TEXTURE_2D,

            0,

            gl.RGBA,

            gl.RGBA,

            gl.UNSIGNED_BYTE,

            textCanvas

        );

    }


    /* =========================
       RESIZE
    ========================= */

    function resize() {

        W =
            hero.clientWidth;


        H =
            hero.clientHeight;


        canvas.width =
            Math.max(

                2,

                Math.round(
                    W *
                    DPR
                )

            );


        canvas.height =
            Math.max(

                2,

                Math.round(
                    H *
                    DPR
                )

            );


        textCanvas.width =
            canvas.width;


        textCanvas.height =
            canvas.height;


        trailCanvas.width =
            Math.max(

                2,

                Math.round(

                    W *
                    TRAIL_SCALE

                )

            );


        trailCanvas.height =
            Math.max(

                2,

                Math.round(

                    H *
                    TRAIL_SCALE

                )

            );


        baseRadius =

            Math.max(
                W,
                H
            ) *

            (
                W < 768
                ?
                0.085
                :
                0.055
            );


        gl.viewport(

            0,
            0,

            canvas.width,
            canvas.height

        );


        gl.uniform2f(

            resolutionUniform,

            W,

            H

        );


        drawTextTexture();


        draw();

    }


    /* =========================
       DRAW
    ========================= */

    function draw() {

        gl.clearColor(
            0,
            0,
            0,
            0
        );


        gl.clear(
            gl.COLOR_BUFFER_BIT
        );


        gl.activeTexture(
            gl.TEXTURE1
        );


        gl.bindTexture(

            gl.TEXTURE_2D,

            trailTexture

        );


        gl.texImage2D(

            gl.TEXTURE_2D,

            0,

            gl.RGBA,

            gl.RGBA,

            gl.UNSIGNED_BYTE,

            trailCanvas

        );


        gl.uniform1f(

            timeUniform,

            performance.now() /
            1000

        );


        gl.drawArrays(

            gl.TRIANGLE_STRIP,

            0,

            4

        );

    }


    /* =========================
       ANIMATION LOOP
    ========================= */

    let running =
        false;


    let lastFrame =
        performance.now();


    let visible =
        true;


    function wake() {

        if (
            running ||
            !visible
        ) {

            return;

        }


        running =
            true;


        lastFrame =
            performance.now();


        requestAnimationFrame(
            tick
        );

    }


    function tick(now) {

        if (
            !running
        ) {

            return;

        }


        const dt =
            clamp(

                (
                    now -
                    lastFrame
                ) /

                1000,

                0.001,

                0.05

            );


        lastFrame =
            now;


        updateTrail(
            dt
        );


        draw();


        if (

            now -
            lastMove >

            4500

            &&

            droplets.length ===
            0

            &&

            !pointer.active

        ) {

            running =
                false;


            trailCtx.clearRect(

                0,
                0,

                trailCanvas.width,

                trailCanvas.height

            );


            draw();


            return;

        }


        requestAnimationFrame(
            tick
        );

    }


    /* =========================
       OBSERVER
    ========================= */

    const observer =
        new IntersectionObserver(

            entries => {

                visible =
                    entries[0]
                    .isIntersecting;


                if (
                    visible
                ) {

                    wake();

                }

            }

        );


    observer.observe(
        hero
    );


    /* =========================
       INIT
    ========================= */

    window.addEventListener(

        "resize",

        resize

    );


    resize();


    if (

        document.fonts

        &&

        document.fonts.load

    ) {

        document.fonts

            .load(
                "800 100px Outfit"
            )

            .then(
                () => {

                    drawTextTexture();

                    draw();

                }
            );

    }


    wake();

})();

</script>


</body>

</html>
