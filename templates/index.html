<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Martin Photography</title>

    <meta
        name="description"
        content="Martin Photography — Moments through my perspective."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Outfit:wght@800&display=swap"
        rel="stylesheet"
    >

    <script>
        // Begin every visit at the hero, even after refreshing a work-section URL.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        if (location.hash === '#work' || location.hash === '#home') {
            history.replaceState(history.state, '', location.pathname + location.search);
        }
        window.addEventListener('pageshow', () => {
            window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        });
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('a[href="#work"], a[href="#home"]').forEach(link => {
                link.addEventListener('click', event => {
                    event.preventDefault();
                    const target = document.querySelector(link.getAttribute('href'));
                    target.scrollIntoView({
                        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth',
                        block: 'start'
                    });
                });
            });
        });
    </script>
    <script type="module" src="/static/vendor/model-viewer.min.js"></script>

    <style>
        .earth-scene { position: fixed; inset: 0; z-index: 1100; background: #000; display: grid; place-items: center; }
        .earth-scene[hidden] { display: none; }
        .earth-stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .earth-stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }
        #earthModel { width: min(58vw, 480px); height: min(58vh, 480px); background: transparent; --progress-bar-color: #777; }
        .earth-back { position: absolute; top: 28px; left: 28px; z-index: 2; background: #000; border: 1px solid #555; color: #eee; padding: 12px 18px; border-radius: 25px; cursor: pointer; }
        .earth-back:focus-visible { outline: 2px solid white; outline-offset: 4px; }

        .desktop { background: #dce6e5; border: 2px solid #30383a; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 90px #0002; min-height: min(65vh, 540px); }
        .desktop-bar { width: 100%; display: flex; justify-content: space-between; padding: 14px 20px; background: #f3f3ee; border-bottom: 1px solid #30383a; font-size: 13px; }
        .desktop-files[hidden], #desktopBack[hidden] { display: none; }
        #desktopBack { border: 1px solid #b1babb; border-radius: 5px; background: white; padding: 4px 9px; cursor: pointer; }
        .desktop-files { width: 100%; display: flex; gap: 24px; padding: 35px 25px; flex: 1; align-items: flex-start; }
        .desktop-folder { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px; cursor: pointer; color: #182426; font: 16px Arial, sans-serif; }
        .desktop-folder model-viewer { width: clamp(100px, 18vw, 170px); height: clamp(100px, 18vw, 160px); pointer-events: none; }
        .desktop-folder span { display: inline-block; padding: 5px 12px; border-radius: 4px; }
        .desktop-folder.selected { background: #fff5; border-color: #456a88; }
        .desktop-folder.selected span { background: #345c7c; color: white; }
        .desktop-folder:focus-visible { outline: 3px solid #345c7c; }
        .desktop-footer { width: 100%; padding: 12px 20px; font-size: 12px; color: #526265; }
        @media (max-width: 480px) { .desktop-files { gap: 10px; padding: 25px 12px; } }


        :root {
            --paper: #f3f3ee;
            --ink: #0b0b0b;

            --gutter:
                clamp(
                    20px,
                    2.8vw,
                    42px
                );

            --display:
                "Outfit",
                "Arial Black",
                system-ui,
                sans-serif;

            --body:
                "Inter Tight",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }


        * {
            box-sizing: border-box;
        }


        html {
            margin: 0;
            padding: 0;

            background:
                var(--paper);

            scroll-behavior:
                smooth;
        }


        body {
            margin: 0;
            padding: 0;

            background:
                var(--paper);

            color:
                var(--ink);

            font-family:
                var(--body);

            -webkit-font-smoothing:
                antialiased;

            overflow-x:
                hidden;
        }


        a {
            color: inherit;

            text-decoration:
                none;
        }


        /* ==================================================
           ORIGINAL MARTIN HERO
        ================================================== */

        .hero {
            position:
                relative;

            width:
                100%;

            height:
                100vh;

            height:
                100svh;

            min-height:
                540px;

            overflow:
                hidden;

            background:
                var(--paper);

            isolation:
                isolate;

            touch-action:
                pan-y;

            -webkit-tap-highlight-color:
                transparent;
        }


        .hero__photo {
            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            object-position:
                center;

            z-index:
                0;

            pointer-events:
                none;
        }


        .hero__paper {
            position:
                absolute;

            inset:
                0;

            z-index:
                1;

            display:
                grid;

            place-items:
                center;

            background:
                var(--paper);
        }


        .hero__title {
            margin:
                0;

            font-family:
                var(--display);

            font-weight:
                800;

            font-size:
                18vw;

            line-height:
                1;

            letter-spacing:
                -0.055em;

            color:
                var(--ink);

            white-space:
                nowrap;

            user-select:
                none;
        }


        .hero.gl-on
        .hero__paper {
            background:
                transparent;
        }


        .hero.gl-on
        .hero__title {
            color:
                transparent;
        }


        .hero__reveal {
            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            z-index:
                2;

            display:
                block;

            pointer-events:
                none;
        }


        .chrome {
            position:
                absolute;

            inset:
                0;

            z-index:
                3;

            padding:
                var(--gutter);

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                space-between;

            pointer-events:
                none;

            mix-blend-mode:
                difference;

            color:
                #ffffff;
        }


        .chrome a {
            pointer-events:
                auto;
        }


        .intro__lede {
            margin:
                0;

            font-size:
                clamp(
                    18px,
                    1.55vw,
                    25px
                );

            line-height:
                1.05;

            letter-spacing:
                -0.02em;
        }


        .cta {
            display:
                inline-flex;

            align-items:
                center;

            gap:
                12px;

            margin-top:
                26px;

            padding:
                14px
                21px
                14px
                23px;

            border-radius:
                999px;

            background:
                #ffffff;

            color:
                #000000;

            font:
                500
                12px/1
                var(--body);

            letter-spacing:
                .07em;

            text-transform:
                uppercase;

            transition:
                transform
                .35s
                cubic-bezier(.2,.8,.2,1);
        }


        .cta:hover {
            transform:
                translateY(-3px);
        }


        .cta:active {
            transform:
                scale(.97);
        }


        .cta svg {
            width:
                15px;

            height:
                15px;

            transition:
                transform
                .35s
                cubic-bezier(.2,.8,.2,1);
        }


        .cta:hover svg {
            transform:
                translateX(3px);
        }


        .foot {
            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-end;

            gap:
                20px;

            font-size:
                11px;

            line-height:
                1.2;
        }


        .links {
            display:
                flex;

            gap:
                9px;

            align-items:
                center;

            font-weight:
                500;

            letter-spacing:
                .06em;

            text-transform:
                uppercase;
        }


        .links a:hover {
            text-decoration:
                underline;

            text-underline-offset:
                4px;
        }


        .hint {
            position:
                absolute;

            left:
                50%;

            bottom:
                calc(
                    var(--gutter)
                    + 2px
                );

            transform:
                translateX(-50%);

            margin:
                0;

            font-size:
                11px;

            letter-spacing:
                .07em;

            text-transform:
                uppercase;

            opacity:
                .45;

            transition:
                opacity
                .6s
                ease;

            white-space:
                nowrap;
        }


        .hint.is-gone {
            opacity:
                0;
        }


        .hint .touch {
            display:
                none;
        }


        @media (hover:none) {

            .hint .mouse {
                display:
                    none;
            }


            .hint .touch {
                display:
                    inline;
            }

        }


        /* ==================================================
           WORK — PURE WHITE VOID
        ================================================== */

        .work {
            position:
                relative;

            width:
                100%;

            min-height:
                100vh;

            min-height:
                100svh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            background:
                #ffffff;

            padding:
                80px 20px;
        }


        .work__label {
            position:
                absolute;

            top:
                32px;

            left:
                34px;

            margin:
                0;

            color:
                #777;

            font-size:
                11px;

            letter-spacing:
                .15em;

            text-transform:
                uppercase;
        }


        .work__back {
            position:
                absolute;

            top:
                32px;

            right:
                34px;

            color:
                #777;

            font-size:
                11px;

            letter-spacing:
                .12em;

            text-transform:
                uppercase;
        }


        .work__back:hover {
            color:
                #000;
        }


        /* ==================================================
           RETRO COMPUTER
        ================================================== */

        .computer-button {
            position:
                relative;

            border:
                none;

            padding:
                0;

            background:
                transparent;

            cursor:
                pointer;

            transition:
                transform
                .55s
                cubic-bezier(.2,.8,.2,1);

            outline:
                none;
        }


        .computer-button:hover {
            transform:
                translateY(-10px)
                scale(1.025);
        }


        .computer-button:active {
            transform:
                scale(.98);
        }


        .computer-button.opening {
            transform:
                scale(1.3);

            pointer-events:
                none;
        }


        #computerModel {
            display: block;
            width: min(85vw, 580px);
            height: min(65vh, 500px);
            min-height: 280px;
            pointer-events: none;
            --progress-bar-color: #111;
        }

        .computer-button:focus-visible {
            outline: 3px solid #4069bc;
            outline-offset: 8px;
            border-radius: 16px;
        }

        .model-status {
            position: absolute;
            inset: 50% 0 auto;
            font-size: 13px;
            color: #555;
            text-align: center;
        }

        .computer-caption {
            position:
                absolute;

            left:
                50%;

            top:
                calc(
                    50%
                    + 310px
                );

            transform:
                translateX(-50%);

            margin:
                0;

            color:
                #888;

            font-size:
                11px;

            letter-spacing:
                .14em;

            text-transform:
                uppercase;

            white-space:
                nowrap;
        }


        /* ==================================================
           PHOTO VIEWER
        ================================================== */

        .viewer {
            position:
                fixed;

            inset:
                0;

            z-index:
                1000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .985
                );

            opacity:
                0;

            visibility:
                hidden;

            pointer-events:
                none;

            transition:
                opacity
                .55s
                ease,

                visibility
                .55s
                ease;
        }


        .viewer.open {
            opacity:
                1;

            visibility:
                visible;

            pointer-events:
                auto;
        }


        .viewer__content {
            width:
                min(
                    1100px,
                    94vw
                );

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            opacity:
                0;

            transform:
                scale(.78);

            transition:
                transform
                .8s
                cubic-bezier(.2,.8,.2,1),

                opacity
                .55s
                ease;
        }


        .viewer.open
        .viewer__content {
            opacity:
                1;

            transform:
                scale(1);
        }


        .viewer img {
            display:
                block;

            width:
                auto;

            height:
                auto;

            max-width:
                100%;

            max-height:
                78vh;

            object-fit:
                contain;

            box-shadow:
                0
                28px
                80px
                rgba(0,0,0,.13);
        }


        .viewer__meta {
            width:
                100%;

            display:
                flex;

            justify-content:
                space-between;

            gap:
                20px;

            padding-top:
                14px;

            color:
                #666;

            font-size:
                11px;

            letter-spacing:
                .1em;

            text-transform:
                uppercase;
        }


        .viewer__close {
            position:
                fixed;

            top:
                max(
                    22px,
                    env(
                        safe-area-inset-top
                    )
                );

            right:
                24px;

            z-index:
                1001;

            width:
                48px;

            height:
                48px;

            border:
                1px
                solid
                #222;

            border-radius:
                50%;

            background:
                #ffffff;

            color:
                #111;

            font-size:
                25px;

            cursor:
                pointer;
        }


        @media
        (max-width: 767px) {

            :root {
                --gutter:
                    30px;
            }


            .hero {
                min-height:
                    620px;
            }


            .intro__lede {
                font-size:
                    27px;
            }


            .cta {
                margin-top:
                    29px;

                padding:
                    17px
                    28px;

                font-size:
                    13px;
            }


            .foot {
                font-size:
                    10px;
            }


            .hint {
                bottom:
                    calc(
                        var(--gutter)
                        + 27px
                    );
            }


            .work__label {
                top:
                    24px;

                left:
                    20px;
            }


            .work__back {
                top:
                    24px;

                right:
                    20px;
            }


            .computer {
                width:
                    min(
                        72vw,
                        330px
                    );
            }


            .monitor {
                height:
                    285px;
            }


            .screen-frame {
                top:
                    28px;

                height:
                    140px;
            }


            .screen-content {
                font-size:
                    28px;
            }


            .disk-slot {
                top:
                    195px;

                width:
                    58px;
            }


            .keyboard {
                min-height:
                    85px;

                padding:
                    13px
                    14px;
            }


            .key {
                height:
                    14px;
            }


            .mouse {
                right:
                    -53px;

                width:
                    44px;

                height:
                    56px;
            }


            .cable {
                display:
                    none;
            }


            .computer-caption {
                top:
                    calc(
                        50%
                        + 250px
                    );
            }


            .viewer {
                padding:
                    20px;
            }


            .viewer img {
                max-height:
                    72vh;
            }

        }

    </style>
</head>


<body>


<section
    class="hero"
    id="home"
    aria-label="Martin Photography"
>


    <img
        class="hero__photo"
        src="/static/images/DSC00686-2.JPG"
        alt=""
        aria-hidden="true"
    >


    <div class="hero__paper">

        <h1
            class="hero__title"
        >
            MARTIN
        </h1>

    </div>


    <canvas
        class="hero__reveal"
        id="heroReveal"
        aria-hidden="true"
    ></canvas>


    <div class="chrome">


        <div class="intro">

            <p class="intro__lede">
                Martin Photography.<br>
                Moments through my perspective.
            </p>


            <a
                class="cta"
                href="#work"
            >

                View my work

                <svg
                    viewBox="0 0 16 16"
                    fill="none"
                    aria-hidden="true"
                >

                    <path
                        d="M2 8h11m0 0L8.5 3.5M13 8l-4.5 4.5"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />

                </svg>

            </a>

        </div>


        <div class="foot">

            <span>
                Photographer — Martin
            </span>


            <nav
                class="links"
                aria-label="Social"
            >

                <a href="#">
                    Instagram
                </a>

                <span>/</span>

                <a href="#">
                    Contact
                </a>

                <span>/</span>
                <a href="{{ url_for('account') if session.get('user_id') else url_for('login') }}">
                    {{ 'Account' if session.get('user_id') else 'Log in' }}
                </a>

            </nav>

        </div>


        <p
            class="hint"
            id="hint"
        >

            <span class="mouse">
                Move to reveal
            </span>

            <span class="touch">
                Touch to reveal
            </span>

        </p>

    </div>

</section>


<section
    class="work"
    id="work"
>


    <p class="work__label">
        Martin / Selected Work
    </p>


    <a
        class="work__back"
        href="#home"
    >
        Back home
    </a>


    <button
        class="computer-button"
        id="computerButton"
        aria-label="Open computer desktop"
    >

        <model-viewer
            id="computerModel"
            src="/static/models/simple-computer.glb"
            alt="Simple computer by Robert Schlyter"
            camera-orbit="155deg 75deg auto"
            field-of-view="30deg"
            shadow-intensity="1"
            exposure="1"
            loading="eager"
            interaction-prompt="none"
            aria-hidden="true"
        ></model-viewer>
        <span class="model-status" id="modelStatus" aria-live="polite">Loading computer…</span>

    </button>


    <p class="computer-caption">
        Click the computer
    </p>

</section>


<div
    class="viewer"
    id="viewer"
>


    <button
        class="viewer__close"
        id="closeViewer"
    >
        ×
    </button>


    <div class="viewer__content desktop">
        <div class="desktop-bar"><span>MARTIN</span><span id="desktopPath">Desktop</span><button id="desktopBack" type="button" hidden>← Desktop</button></div>
        <div class="desktop-files" id="desktopRoot">
            <button class="desktop-folder" type="button" aria-label="Open pictures folder"><model-viewer src="/static/models/file-folder.glb" alt="File folder by Ryan Dewalt" camera-orbit="-20deg 75deg auto" shadow-intensity="0.5" interaction-prompt="none" aria-hidden="true"></model-viewer><span>pictures</span></button>
            <button class="desktop-folder" id="gameFolder" type="button" aria-label="Open game folder"><model-viewer src="/static/models/file-folder.glb" alt="File folder by Ryan Dewalt" camera-orbit="-20deg 75deg auto" shadow-intensity="0.5" interaction-prompt="none" aria-hidden="true"></model-viewer><span>game</span></button>
        </div>
        <div class="desktop-files" id="gameFiles" hidden>
            <button class="desktop-folder" id="earthFolder" type="button" aria-label="Open earth folder"><model-viewer src="/static/models/file-folder.glb" alt="File folder by Ryan Dewalt" camera-orbit="-20deg 75deg auto" shadow-intensity="0.5" interaction-prompt="none" aria-hidden="true"></model-viewer><span>earth</span></button>
        </div>
        <div class="desktop-footer" id="desktopCount">2 folders</div>
    </div>

</div>


<audio id="earthMusic" src="/static/audio/earth-music.m4a" loop preload="none"></audio>

<section class="earth-scene" id="earthScene" role="dialog" aria-modal="true" aria-label="Earth in space" hidden>
    <div class="earth-stars" id="earthStars" aria-hidden="true"></div>
    <button class="earth-back" id="earthBack" type="button">← Back to game</button>
    <model-viewer id="earthModel" camera-controls disable-pan disable-zoom min-camera-orbit="auto 75deg auto" max-camera-orbit="auto 75deg auto" touch-action="none" data-src="/static/models/earth.glb" alt="Earth by Poly by Google, slowly rotating in space" auto-rotate auto-rotate-delay="0" rotation-per-second="5deg" camera-orbit="0deg 75deg auto" shadow-intensity="0" interaction-prompt="none"></model-viewer>
</section>

<!-- 只新增的电脑点击音效 -->
<audio
    id="computerSound"
    preload="auto"
>
    <source
        src="/static/audio/375A0D96-73DA-47B7-842B-658940D352BF.mp3"
        type="audio/mpeg"
    >
</audio>


<script>

(() => {


    const hero =
        document.querySelector(
            ".hero"
        );


    const canvas =
        document.getElementById(
            "heroReveal"
        );


    const hint =
        document.getElementById(
            "hint"
        );


    const PAPER = [

        0xf3 / 255,

        0xf3 / 255,

        0xee / 255

    ];


    const INK = [

        0x0b / 255,

        0x0b / 255,

        0x0b / 255

    ];


    const TRAIL_SCALE =
        .35;


    const DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const reduceMotion =
        window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;


    let W =
        1;


    let H =
        1;


    let baseRadius =
        60;


    const textCanvas =
        document.createElement(
            "canvas"
        );


    const textCtx =
        textCanvas.getContext(
            "2d"
        );


    const trailCanvas =
        document.createElement(
            "canvas"
        );


    const trailCtx =
        trailCanvas.getContext(
            "2d"
        );


    const pointer = {

        active:
            false,

        x:
            0,

        y:
            0,

        px:
            0,

        py:
            0,

        vx:
            0,

        vy:
            0

    };


    let droplets =
        [];


    let lastMove =
        performance.now();


    function clamp(
        value,
        min,
        max
    ) {

        return Math.max(
            min,
            Math.min(
                max,
                value
            )
        );

    }


    function stamp(
        x,
        y,
        radius,
        vx,
        vy,
        alpha
    ) {

        const sx =
            x *
            TRAIL_SCALE;


        const sy =
            y *

            Math.max(
                1,
                radius *
                TRAIL_SCALE
            );


        const k =
            .012;


        const red =
            Math.round(

                128 +

                clamp(
                    vx * k,
                    -1,
                    1
                ) *

                127

            );


        const green =
            Math.round(

                128 +

                clamp(
                    vy * k,
                    -1,
                    1
                ) *

                127

            );


        const gradient =
            trailCtx
            .createRadialGradient(

                sx,
                sy,
                0,

                sx,
                sy,
                sr

            );


        gradient.addColorStop(

            0,

            `rgba(${red},${green},0,${alpha})`

        );


        gradient.addColorStop(

            .5,

            `rgba(${red},${green},0,${alpha * .85})`

        );


        gradient.addColorStop(

            1,

            `rgba(${red},${green},0,0)`

        );


        trailCtx.fillStyle =
            gradient;


        trailCtx.beginPath();


        trailCtx.arc(
            sx,
            sy,
            sr,
            0,
            Math.PI * 2
        );


        trailCtx.fill();

    }


    function updateTrail(
        dt
    ) {

        const frame =
            dt *
            60;


        trailCtx.globalCompositeOperation =
            "destination-out";


        trailCtx.fillStyle =
            `rgba(0,0,0,${
                1 -
                Math.pow(
                    1 - .03,
                    frame
                )
            })`;


        trailCtx.fillRect(

            0,
            0,

            trailCanvas.width,
            trailCanvas.height

        );


        trailCtx.globalCompositeOperation =
            "source-over";


        if (
            pointer.active
        ) {

            const dx =
                pointer.x -
                pointer.px;


            const dy =
                pointer.y -
                pointer.py;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance >
                .5
            ) {

                pointer.vx +=

                    (
                        dx /
                        Math.max(
                            frame,
                            .001
                        )

                        -

                        pointer.vx

                    ) *

                    .5;


                pointer.vy +=

                    (
                        dy /
                        Math.max(
                            frame,
                            .001
                        )

                        -

                        pointer.vy

                    ) *

                    .5;


                const speed =
                    Math.hypot(
                        pointer.vx,
                        pointer.vy
                    );


                const radius =

                    baseRadius *

                    (
                        .75 +

                        Math.min(
                            speed / 45,
                            1
                        ) *

                        .75
                    );


                const steps =
                    Math.max(

                        1,

                        Math.ceil(

                            distance /

                            (
                                radius *
                                .22
                            )

                        )

                    );


                for (
                    let i = 1;
                    i <= steps;
                    i++
                ) {

                    const t =
                        i /
                        steps;


                    stamp(

                        pointer.px +
                        dx * t,

                        pointer.py +
                        dy * t,

                        radius,

                        pointer.vx *
                        6,

                        pointer.vy *
                        6,

                        .92

                    );

                }


                if (
                    !reduceMotion
                ) {

                    const count =
                        Math.min(

                            3,

                            Math.floor(
                                speed /
                                14
                            )

                        );


                    for (
                        let i = 0;
                        i < count;
                        i++
                    ) {

                        const angle =

                            Math.atan2(
                                pointer.vy,
                                pointer.vx
                            )

                            +

                            (
                                Math.random()
                                -
                                .5
                            ) *

                            1.4;


                        const dropSpeed =

                            speed *

                            (
                                .35 +

                                Math.random() *

                                .45
                            );


                        droplets.push({

                            x:

                                pointer.x +

                                (
                                    Math.random()
                                    -
                                    .5
                                ) *

                                radius,


                            y:

                                pointer.y +

                                (
                                    Math.random()
                                    -
                                    .5
                                ) *

                                radius,


                            vx:

                                Math.cos(
                                    angle
                                ) *

                                dropSpeed,


                            vy:

                                Math.sin(
                                    angle
                                ) *

                                dropSpeed,


                            radius:

                                radius *

                                (
                                    .20 +

                                    Math.random() *

                                    .35
                                ),


                            life:
                                1

                        });

                    }


                    if (
                        droplets.length >
                        90
                    ) {

                        droplets.splice(

                            0,

                            droplets.length
                            -
                            90

                        );

                    }

                }


                pointer.px =
                    pointer.x;


                pointer.py =
                    pointer.y;

            }

            else {

                pointer.vx *=
                    .8;


                pointer.vy *=
                    .8;

            }

        }


        for (
            let i =
                droplets.length - 1;

            i >= 0;

            i--
        ) {

            const drop =
                droplets[i];


            drop.x +=
                drop.vx *
                frame;


            drop.y +=
                drop.vy *
                frame;


            drop.vx *=
                Math.pow(
                    .90,
                    frame
                );


            drop.vy =

                drop.vy *

                Math.pow(
                    .90,
                    frame
                )

                +

                .25 *
                frame;


            drop.life -=
                .022 *
                frame;


            drop.radius *=
                Math.pow(
                    .985,
                    frame
                );


            if (
                drop.life <= 0
                ||
                drop.radius < 2
            ) {

                droplets.splice(
                    i,
                    1
                );


                continue;

            }


            stamp(

                drop.x,

                drop.y,

                drop.radius,

                drop.vx *
                6,

                drop.vy *
                6,

                .85 *
                drop.life

            );

        }

    }


    function onMove(
        x,
        y
    ) {

            !pointer.active

            pointer.active =
                true;


            pointer.x =
                x;


            pointer.y =
                y;


            pointer.px =
                x;


            pointer.py =
                y;

        }

        else {

            pointer.x =
                x;


            pointer.y =
                y;

            performance.now();

                floor(

                vec3 x2 =

                    i2

                        ns.z

                        ns.z

                vec4 y_ =

                        *
                        x_

                vec4 x =

                    *
                    ns.x

                vec4 s1 =
                    floor(b1)
                    *
                    2.0
                    +
                    1.0;


                vec4 sh =

                vec4 a0 =

                    s0.xzyw

                    *

                    sh.xxyy;


                vec4 a1 =

                    b1.xzyw

                    +

                    s1.xzyw

                    *

                    sh.zzww;


                vec3 p0 =
                    vec3(
                        a0.xy,
                        h.x
                    );


                vec3 p1 =
                    vec3(
                        a0.zw,
                        h.y
                    );


                vec3 p2 =
                    vec3(
                        a1.xy,
                        h.z
                    );


                vec3 p3 =
                    vec3(
                        a1.zw,
                        h.w
                    );


                vec4 norm =

                    taylorInvSqrt(

                        vec4(

                            dot(
                                p0,
                                p0
                            ),

                            dot(
                                p1,
                                p1
                            ),

                            dot(
                                p2,
                                p2
                            ),

                            dot(
                                p3,
                                p3
                            )

                        )

                    );


                p0 *=
                    norm.x;


                p1 *=
                    norm.y;


                p2 *=
                    norm.z;


                p3 *=
                    norm.w;


                vec4 m =

                    max(

                        0.6

                        -

                        vec4(

                            dot(
                                x0,
                                x0
                            ),

                            dot(
                                x1,
                                x1
                            ),

                            dot(
                                x2,
                                x2
                            ),

                            dot(
                                x3,
                                x3
                            )

                        ),

                        0.0

                    );


                m =
                    m *
                    m;


                return

                    42.0

                    *

                    dot(

                        m *
                        m,

                        vec4(

                            dot(
                                p0,
                                x0
                            ),

                            dot(
                                p1,
                                x1
                            ),

                            dot(
                                p2,
                                x2
                            ),

                            dot(
                                p3,
                                x3
                            )

                        )

                    );

            }


            void main() {

                vec2 uv =
                    vUv;


                vec2 asp =
                    vec2(
                        uRes.x /
                        uRes.y,
                        1.0
                    );


                float n1 =

                    snoise(

                            asp *
                            2.6,

                            .35

                            asp *
                            2.6

                        -
                        .5

                    1.0
                    -
                    hole;


                gl_FragColor =

                    vec4(

                        colour
                        *
                        alpha,

                        alpha

                    );

            }

        `;


        function shader(

            function resize() {

                W =

                H =
                    hero.clientHeight;

                    Math.max(

                        2,

                        Math.round(

                            DPR

                            DPR

                            TRAIL_SCALE

                trailCanvas.height =

                    Math.max(

                        2,

                        Math.round(

                            H *
                            TRAIL_SCALE

            function draw() {

                gl.clearColor(
                    0,
                    0,
                    0,
                    0
                );


                gl.clear(
                    gl.COLOR_BUFFER_BIT
                );


                gl.activeTexture(
                    gl.TEXTURE1
                );


                gl.bindTexture(

                    gl.TEXTURE_2D,

                    trailTexture

                );


                gl.texImage2D(

                    gl.TEXTURE_2D,

                    0,

                    gl.RGBA,

                    gl.RGBA,

                    gl.UNSIGNED_BYTE,

                    trailCanvas

                );


                gl.uniform1f(

                    uTime,

                    performance.now()
                    /
                    1000

                );


                gl.drawArrays(

                    gl.TRIANGLE_STRIP,

                    0,

                    4

                );

            }


            let running =
                false;


            let last =
                performance.now();


            let visible =
                true;


            window.wake =
                wake;


            function wake() {

                if (
                    running
                    ||
                    !visible
                ) {

                    return;

                }


                running =
                    true;


                last =
                    performance.now();


                requestAnimationFrame(
                    tick
                );

            }


            function tick(
                now
            ) {

                if (
                    !running
                ) {

                    return;

                }


                const dt =
                    clamp(

                        (
                            now
                            -
                            last
                        )

                        /

                        1000,

                        .001,

                        .05

                    );


                last =
                    now;


                updateTrail(
                    dt
                );


                draw();


                if (

                    now
                    -
                    lastMove
                    >
                    4500

                    &&

                    droplets.length
                    ===
                    0

                    &&

                    !pointer.active

                ) {

                    running =
                        false;


                    trailCtx.clearRect(

                        0,
                        0,

                        trailCanvas.width,
                        trailCanvas.height

                    );


                    draw();


                    return;

                }


                requestAnimationFrame(
                    tick
                );

            }


            const observer =

                new IntersectionObserver(

                    entries => {

                        visible =

                            entries[0]
                            .isIntersecting;


                        if (
                            visible
                        ) {

                            wake();

                        }

                    }

                );


            observer.observe(
                hero
            );


            window.addEventListener(

                "resize",

                resize

            );


            resize();


            if (

                document.fonts
                &&
                document.fonts.load

            ) {

                document.fonts

                .load(
                    "800 100px Outfit"
                )

                .then(
                    () => {

                        drawText();

                        draw();

                    }
                );

            }


            wake();

        }

    }


    /* ==================================================
       COMPUTER → PHOTO
    ================================================== */

    const computer =
        document.getElementById(
            "computerButton"
        );


    /* 新增：电脑点击音效 */
    const computerModel = document.getElementById('computerModel');
    const modelStatus = document.getElementById('modelStatus');
    computerModel.addEventListener('load', () => { modelStatus.hidden = true; });
    computerModel.addEventListener('error', () => {
        modelStatus.textContent = 'Computer unavailable. Click to view photograph.';
    });
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        computer.addEventListener('pointermove', event => {
            const bounds = computer.getBoundingClientRect();
            const angle = 155 + ((event.clientX - bounds.left) / bounds.width - .5) * 30;
            computerModel.cameraOrbit = `${angle}deg 75deg auto`;
        });
        computer.addEventListener('pointerleave', () => {
            computerModel.cameraOrbit = '155deg 75deg auto';
        });
    }

    const computerSound =
        document.getElementById(
            "computerSound"
        );


    const viewer =
        document.getElementById(
            "viewer"
        );


    const closeViewer =
        document.getElementById(
            "closeViewer"
        );


    const earthScene = document.getElementById('earthScene');
    const earthModel = document.getElementById('earthModel');
    const earthMusic = document.getElementById('earthMusic');
    function resetEarth() {
        earthModel.cameraOrbit = '0deg 75deg auto';
        earthModel.resetTurntableRotation(0);
        earthModel.jumpCameraToGoal();
    }
    earthModel.addEventListener('load', () => {
        if (!earthScene.hidden) resetEarth();
    });
    const earthBack = document.getElementById('earthBack');
    const earthFolder = document.getElementById('earthFolder');
    const gameFolder = document.getElementById('gameFolder');
    const desktopBack = document.getElementById('desktopBack');
    function showDesktopFolder(game) {
        document.getElementById('desktopRoot').hidden = game;
        document.getElementById('gameFiles').hidden = !game;
        desktopBack.hidden = !game;
        document.getElementById('desktopPath').textContent = game ? 'Desktop / game' : 'Desktop';
        document.getElementById('desktopCount').textContent = game ? '1 folder' : '2 folders';
        document.querySelectorAll('.desktop-folder').forEach(folder => {
            folder.classList.remove('selected');
            folder.setAttribute('aria-pressed', 'false');
        });
    }
    desktopBack.addEventListener('click', () => { showDesktopFolder(false); gameFolder.focus(); });
    const stars = document.getElementById('earthStars');
    for (let i = 0; i < 90; i++) {
        const star = document.createElement('i');
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.opacity = .2 + Math.random() * .6;
        const size = Math.random() > .9 ? 2 : 1;
        star.style.width = star.style.height = `${size}px`;
        stars.appendChild(star);
    }
    let earthPress;
    earthModel.addEventListener('pointerdown', event => {
        earthPress = { x: event.clientX, y: event.clientY, moved: false, time: performance.now() };
    });
    earthModel.addEventListener('pointermove', event => {
        if (earthPress && Math.hypot(event.clientX - earthPress.x, event.clientY - earthPress.y) > 8) earthPress.moved = true;
    });
    earthModel.addEventListener('pointercancel', () => { earthPress = null; });
    earthModel.addEventListener('pointerup', event => {
        if (earthPress && !earthPress.moved && performance.now() - earthPress.time < 600) {
            closeEarth();
            location.href = '/world';
        }
        earthPress = null;
    });
    function openEarth() {
        earthScene.hidden = false;
        if (!earthModel.hasAttribute('src')) earthModel.setAttribute('src', earthModel.dataset.src);
        if (earthModel.loaded) resetEarth();
        earthMusic.currentTime = 0;
        if (earthMusic.hasAttribute('src')) {
            earthMusic.play().catch(() => {});
        }
        earthModel.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
        earthBack.focus();
    }
    function closeEarth() {
        earthScene.hidden = true;
        earthMusic.pause();
        earthMusic.currentTime = 0;
        earthModel.autoRotate = false;
        earthFolder.focus();
    }
    earthBack.addEventListener('click', closeEarth);
    earthScene.addEventListener('keydown', event => {
        if (event.key === 'Tab') { event.preventDefault(); earthBack.focus(); }
    });

    document.querySelectorAll('.desktop-folder').forEach(folder => {
        const model = folder.querySelector('model-viewer');
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            folder.addEventListener('pointermove', event => {
                const bounds = folder.getBoundingClientRect();
                const x = (event.clientX - bounds.left) / bounds.width - .5;
                const y = (event.clientY - bounds.top) / bounds.height - .5;
                model.cameraOrbit = `${-20 + x * 40}deg ${75 + y * 20}deg auto`;
            });
            folder.addEventListener('pointerleave', () => {
                model.cameraOrbit = '-20deg 75deg auto';
            });
        }
        folder.addEventListener('click', () => {
            document.querySelectorAll('.desktop-folder').forEach(item => {
                item.classList.toggle('selected', item === folder);
                item.setAttribute('aria-pressed', String(item === folder));
            });
            if (folder === gameFolder) { showDesktopFolder(true); earthFolder.focus(); }
            if (folder === earthFolder) openEarth();
        });
    });

    function openPhoto() {
        showDesktopFolder(false);


        /* 新增：点击电脑立刻播放一次音效 */

        computerSound.currentTime =
            0;


        computerSound
            .play()
            .catch(
                () => {}
            );


        computer
        .classList
        .add(
            "opening"
        );


        setTimeout(
            () => {

                viewer
                .classList
                .add(
                    "open"
                );


                document.body.style.overflow =
                    "hidden";


                computer
                .classList
                .remove(
                    "opening"
                );

            },

            430

        );

    }


    function closePhoto() {

        viewer
        .classList
        .remove(
            "open"
        );


        document.body.style.overflow =
            "";

    }


    computer.addEventListener(
        "click",
        openPhoto
    );


    closeViewer.addEventListener(
        "click",
        closePhoto
    );


    viewer.addEventListener(

        "click",

        event => {

            if (
                event.target ===
                viewer
            ) {

                closePhoto();

            }

        }

    );


    document.addEventListener(

        "keydown",

        event => {

            if (
                event.key ===
                "Escape"
            ) {

                if (!earthScene.hidden) closeEarth();
                else if (!desktopBack.hidden) { showDesktopFolder(false); gameFolder.focus(); }
                else closePhoto();

            }

        }

    );

})();

</script>


</body>

</html>
