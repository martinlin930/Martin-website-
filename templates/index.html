<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Martin Photography</title>

    <meta
        name="description"
        content="Martin Photography — Moments through my perspective."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Outfit:wght@800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --paper: #f3f3ee;
            --ink: #0b0b0b;

            --gutter:
                clamp(
                    20px,
                    2.8vw,
                    42px
                );

            --display:
                "Outfit",
                "Arial Black",
                system-ui,
                sans-serif;

            --body:
                "Inter Tight",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }


        * {
            box-sizing: border-box;
        }


        html {
            margin: 0;
            padding: 0;

            background:
                var(--paper);

            scroll-behavior:
                smooth;
        }


        body {
            margin: 0;
            padding: 0;

            background:
                var(--paper);

            color:
                var(--ink);

            font-family:
                var(--body);

            -webkit-font-smoothing:
                antialiased;

            overflow-x:
                hidden;
        }


        a {
            color: inherit;

            text-decoration:
                none;
        }


        /* ==================================================
           ORIGINAL MARTIN HERO
        ================================================== */

        .hero {
            position:
                relative;

            width:
                100%;

            height:
                100vh;

            height:
                100svh;

            min-height:
                540px;

            overflow:
                hidden;

            background:
                var(--paper);

            isolation:
                isolate;

            touch-action:
                pan-y;

            -webkit-tap-highlight-color:
                transparent;
        }


        /* PHOTO UNDER PAPER */

        .hero__photo {
            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            object-position:
                center;

            z-index:
                0;

            pointer-events:
                none;
        }


        /* FALLBACK PAPER */

        .hero__paper {
            position:
                absolute;

            inset:
                0;

            z-index:
                1;

            display:
                grid;

            place-items:
                center;

            background:
                var(--paper);
        }


        .hero__title {
            margin:
                0;

            font-family:
                var(--display);

            font-weight:
                800;

            font-size:
                18vw;

            line-height:
                1;

            letter-spacing:
                -0.055em;

            color:
                var(--ink);

            white-space:
                nowrap;

            user-select:
                none;
        }


        .hero.gl-on
        .hero__paper {
            background:
                transparent;
        }


        .hero.gl-on
        .hero__title {
            color:
                transparent;
        }


        /* WEBGL */

        .hero__reveal {
            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            z-index:
                2;

            display:
                block;

            pointer-events:
                none;
        }


        /* UI */

        .chrome {
            position:
                absolute;

            inset:
                0;

            z-index:
                3;

            padding:
                var(--gutter);

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                space-between;

            pointer-events:
                none;

            mix-blend-mode:
                difference;

            color:
                #ffffff;
        }


        .chrome a {
            pointer-events:
                auto;
        }


        .intro__lede {
            margin:
                0;

            font-size:
                clamp(
                    18px,
                    1.55vw,
                    25px
                );

            line-height:
                1.05;

            letter-spacing:
                -0.02em;
        }


        .cta {
            display:
                inline-flex;

            align-items:
                center;

            gap:
                12px;

            margin-top:
                26px;

            padding:
                14px
                21px
                14px
                23px;

            border-radius:
                999px;

            background:
                #ffffff;

            color:
                #000000;

            font:
                500
                12px/1
                var(--body);

            letter-spacing:
                .07em;

            text-transform:
                uppercase;

            transition:
                transform
                .35s
                cubic-bezier(.2,.8,.2,1);
        }


        .cta:hover {
            transform:
                translateY(-3px);
        }


        .cta:active {
            transform:
                scale(.97);
        }


        .cta svg {
            width:
                15px;

            height:
                15px;

            transition:
                transform
                .35s
                cubic-bezier(.2,.8,.2,1);
        }


        .cta:hover svg {
            transform:
                translateX(3px);
        }


        .foot {
            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-end;

            gap:
                20px;

            font-size:
                11px;

            line-height:
                1.2;
        }


        .links {
            display:
                flex;

            gap:
                9px;

            align-items:
                center;

            font-weight:
                500;

            letter-spacing:
                .06em;

            text-transform:
                uppercase;
        }


        .links a:hover {
            text-decoration:
                underline;

            text-underline-offset:
                4px;
        }


        .hint {
            position:
                absolute;

            left:
                50%;

            bottom:
                calc(
                    var(--gutter)
                    + 2px
                );

            transform:
                translateX(-50%);

            margin:
                0;

            font-size:
                11px;

            letter-spacing:
                .07em;

            text-transform:
                uppercase;

            opacity:
                .45;

            transition:
                opacity
                .6s
                ease;

            white-space:
                nowrap;
        }


        .hint.is-gone {
            opacity:
                0;
        }


        .hint .touch {
            display:
                none;
        }


        @media (hover:none) {

            .hint .mouse {
                display:
                    none;
            }


            .hint .touch {
                display:
                    inline;
            }

        }


        /* ==================================================
           WORK — PURE WHITE VOID
        ================================================== */

        .work {
            position:
                relative;

            width:
                100%;

            min-height:
                100vh;

            min-height:
                100svh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            background:
                #ffffff;

            padding:
                80px 20px;
        }


        .work__label {
            position:
                absolute;

            top:
                32px;

            left:
                34px;

            margin:
                0;

            color:
                #777;

            font-size:
                11px;

            letter-spacing:
                .15em;

            text-transform:
                uppercase;
        }


        .work__back {
            position:
                absolute;

            top:
                32px;

            right:
                34px;

            color:
                #777;

            font-size:
                11px;

            letter-spacing:
                .12em;

            text-transform:
                uppercase;
        }


        .work__back:hover {
            color:
                #000;
        }


        /* ==================================================
           RETRO COMPUTER
        ================================================== */

        .computer-button {
            position:
                relative;

            border:
                none;

            padding:
                0;

            background:
                transparent;

            cursor:
                pointer;

            transition:
                transform
                .55s
                cubic-bezier(.2,.8,.2,1);

            outline:
                none;
        }


        .computer-button:hover {
            transform:
                translateY(-10px)
                scale(1.025);
        }


        .computer-button:active {
            transform:
                scale(.98);
        }


        .computer-button.opening {
            transform:
                scale(1.3);

            pointer-events:
                none;
        }


        .computer {
            position:
                relative;

            width:
                min(
                    75vw,
                    440px
                );

            filter:
                drop-shadow(
                    0
                    30px
                    28px
                    rgba(0,0,0,.10)
                );
        }


        .monitor {
            position:
                relative;

            width:
                77%;

            height:
                355px;

            margin:
                0 auto;

            border:
                2px
                solid
                #baa889;

            border-radius:
                18px
                18px
                11px
                11px;

            background:
                linear-gradient(
                    145deg,
                    #eee4ce,
                    #d5c4a6
                );
        }


        .monitor::after {
            content:
                "";

            position:
                absolute;

            inset:
                7px;

            border:
                1px
                solid
                rgba(255,255,255,.5);

            border-radius:
                12px;

            pointer-events:
                none;
        }


        .screen-frame {
            position:
                absolute;

            top:
                35px;

            left:
                50%;

            width:
                72%;

            height:
                175px;

            padding:
                11px;

            transform:
                translateX(-50%);

            border-radius:
                13px;

            background:
                #303033;
        }


        .screen {
            position:
                relative;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            border:
                2px
                solid
                #141414;

            border-radius:
                7px;

            background:
                linear-gradient(
                    #d5ded9,
                    #a6b5b0
                );
        }


        .screen-bar {
            height:
                18px;

            background:
                #e0e4df;

            border-bottom:
                1px
                solid
                rgba(0,0,0,.2);
        }


        .screen-content {
            height:
                calc(
                    100%
                    - 18px
                );

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-family:
                var(--display);

            font-size:
                35px;

            letter-spacing:
                -.05em;

            color:
                #151515;
        }


        .disk-slot {
            position:
                absolute;

            top:
                245px;

            right:
                31px;

            width:
                78px;

            height:
                10px;

            background:
                #776b59;

            border-radius:
                2px;
        }


        .computer-logo {
            position:
                absolute;

            left:
                25px;

            bottom:
                27px;

            width:
                13px;

            height:
                13px;

            background:
                #cbb99c;

            border:
                1px
                solid
                #ac987a;
        }


        .computer-neck {
            width:
                67%;

            height:
                17px;

            margin:
                0 auto;

            background:
                #d2c0a2;

            border-left:
                2px
                solid
                #b3a083;

            border-right:
                2px
                solid
                #b3a083;
        }


        .keyboard {
            position:
                relative;

            width:
                100%;

            min-height:
                106px;

            padding:
                18px
                22px;

            border:
                2px
                solid
                #baa789;

            border-radius:
                10px;

            background:
                linear-gradient(
                    145deg,
                    #e9ddc6,
                    #d3c1a3
                );

            transform:
                perspective(500px)
                rotateX(4deg);

            transform-origin:
                top;
        }


        .keys {
            display:
                grid;

            grid-template-columns:
                repeat(
                    12,
                    1fr
                );

            gap:
                5px;
        }


        .key {
            height:
                18px;

            border:
                1px
                solid
                #4e4437;

            border-radius:
                2px;

            background:
                linear-gradient(
                    #887a64,
                    #625543
                );
        }


        .space {
            grid-column:
                span 5;
        }


        .mouse {
            position:
                absolute;

            right:
                -84px;

            bottom:
                3px;

            width:
                59px;

            height:
                72px;

            border:
                2px
                solid
                #baa88a;

            border-radius:
                10px;

            background:
                #ddceb5;
        }


        .mouse::before {
            content:
                "";

            position:
                absolute;

            top:
                11px;

            left:
                50%;

            width:
                26px;

            transform:
                translateX(-50%);

            border-top:
                2px
                solid
                #b5a184;
        }


        .cable {
            position:
                absolute;

            left:
                -70px;

            bottom:
                80px;

            width:
                100px;

            height:
                70px;

            border-left:
                7px
                solid
                #a99168;

            border-bottom:
                7px
                solid
                #a99168;

            border-radius:
                0
                0
                0
                70px;

            transform:
                rotate(-10deg);
        }


        .computer-caption {
            position:
                absolute;

            left:
                50%;

            top:
                calc(
                    50%
                    + 310px
                );

            transform:
                translateX(-50%);

            margin:
                0;

            color:
                #888;

            font-size:
                11px;

            letter-spacing:
                .14em;

            text-transform:
                uppercase;

            white-space:
                nowrap;
        }


        /* ==================================================
           PHOTO VIEWER
        ================================================== */

        .viewer {
            position:
                fixed;

            inset:
                0;

            z-index:
                1000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .985
                );

            opacity:
                0;

            visibility:
                hidden;

            pointer-events:
                none;

            transition:
                opacity
                .55s
                ease,

                visibility
                .55s
                ease;
        }


        .viewer.open {
            opacity:
                1;

            visibility:
                visible;

            pointer-events:
                auto;
        }


        .viewer__content {
            width:
                min(
                    1100px,
                    94vw
                );

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            opacity:
                0;

            transform:
                scale(.78);

            transition:
                transform
                .8s
                cubic-bezier(.2,.8,.2,1),

                opacity
                .55s
                ease;
        }


        .viewer.open
        .viewer__content {
            opacity:
                1;

            transform:
                scale(1);
        }


        .viewer img {
            display:
                block;

            width:
                auto;

            height:
                auto;

            max-width:
                100%;

            max-height:
                78vh;

            object-fit:
                contain;

            box-shadow:
                0
                28px
                80px
                rgba(0,0,0,.13);
        }


        .viewer__meta {
            width:
                100%;

            display:
                flex;

            justify-content:
                space-between;

            gap:
                20px;

            padding-top:
                14px;

            color:
                #666;

            font-size:
                11px;

            letter-spacing:
                .1em;

            text-transform:
                uppercase;
        }


        .viewer__close {
            position:
                fixed;

            top:
                max(
                    22px,
                    env(
                        safe-area-inset-top
                    )
                );

            right:
                24px;

            z-index:
                1001;

            width:
                48px;

            height:
                48px;

            border:
                1px
                solid
                #222;

            border-radius:
                50%;

            background:
                #ffffff;

            color:
                #111;

            font-size:
                25px;

            cursor:
                pointer;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media
        (max-width: 767px) {

            :root {
                --gutter:
                    30px;
            }


            .hero {
                min-height:
                    620px;
            }


            .intro__lede {
                font-size:
                    27px;
            }


            .cta {
                margin-top:
                    29px;

                padding:
                    17px
                    28px;

                font-size:
                    13px;
            }


            .foot {
                font-size:
                    10px;
            }


            .hint {
                bottom:
                    calc(
                        var(--gutter)
                        + 27px
                    );
            }


            .work__label {
                top:
                    24px;

                left:
                    20px;
            }


            .work__back {
                top:
                    24px;

                right:
                    20px;
            }


            .computer {
                width:
                    min(
                        72vw,
                        330px
                    );
            }


            .monitor {
                height:
                    285px;
            }


            .screen-frame {
                top:
                    28px;

                height:
                    140px;
            }


            .screen-content {
                font-size:
                    28px;
            }


            .disk-slot {
                top:
                    195px;

                width:
                    58px;
            }


            .keyboard {
                min-height:
                    85px;

                padding:
                    13px
                    14px;
            }


            .key {
                height:
                    14px;
            }


            .mouse {
                right:
                    -53px;

                width:
                    44px;

                height:
                    56px;
            }


            .cable {
                display:
                    none;
            }


            .computer-caption {
                top:
                    calc(
                        50%
                        + 250px
                    );
            }


            .viewer {
                padding:
                    20px;
            }


            .viewer img {
                max-height:
                    72vh;
            }

        }

    </style>
</head>


<body>


<!-- ==================================================
     WEBGL MARTIN HOME
================================================== -->

<section
    class="hero"
    id="home"
    aria-label="Martin Photography"
>


    <img
        class="hero__photo"
        src="/static/images/DSC00686-2.JPG"
        alt=""
        aria-hidden="true"
    >


    <div class="hero__paper">

        <h1
            class="hero__title"
        >
            MARTIN
        </h1>

    </div>


    <canvas
        class="hero__reveal"
        id="heroReveal"
        aria-hidden="true"
    ></canvas>


    <div class="chrome">


        <div class="intro">

            <p class="intro__lede">
                Martin Photography.<br>
                Moments through my perspective.
            </p>


            <a
                class="cta"
                href="#work"
            >

                View my work

                <svg
                    viewBox="0 0 16 16"
                    fill="none"
                    aria-hidden="true"
                >

                    <path
                        d="M2 8h11m0 0L8.5 3.5M13 8l-4.5 4.5"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />

                </svg>

            </a>

        </div>


        <div class="foot">

            <span>
                Photographer — Martin
            </span>


            <nav
                class="links"
                aria-label="Social"
            >

                <a href="#">
                    Instagram
                </a>

                <span>/</span>

                <a href="#">
                    Contact
                </a>

            </nav>

        </div>


        <p
            class="hint"
            id="hint"
        >

            <span class="mouse">
                Move to reveal
            </span>

            <span class="touch">
                Touch to reveal
            </span>

        </p>

    </div>

</section>


<!-- ==================================================
     WHITE VOID
================================================== -->

<section
    class="work"
    id="work"
>


    <p class="work__label">
        Martin / Selected Work
    </p>


    <a
        class="work__back"
        href="#home"
    >
        Back home
    </a>


    <button
        class="computer-button"
        id="computerButton"
        aria-label="Open photograph"
    >

        <div class="computer">


            <div class="cable"></div>


            <div class="monitor">


                <div class="screen-frame">

                    <div class="screen">

                        <div
                            class="screen-bar"
                        ></div>


                        <div
                            class="screen-content"
                        >
                            MARTIN
                        </div>

                    </div>

                </div>


                <div class="disk-slot"></div>


                <div
                    class="computer-logo"
                ></div>

            </div>


            <div
                class="computer-neck"
            ></div>


            <div class="keyboard">

                <div class="keys">

                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>

                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>

                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>

                    <div
                        class="key space"
                    ></div>

                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>

                </div>

            </div>


            <div class="mouse"></div>

        </div>

    </button>


    <p class="computer-caption">
        Click the computer
    </p>

</section>


<!-- ==================================================
     ONE PHOTO ONLY
================================================== -->

<div
    class="viewer"
    id="viewer"
>


    <button
        class="viewer__close"
        id="closeViewer"
    >
        ×
    </button>


    <div class="viewer__content">


        <img
            src="/static/images/DSC00686-2.JPG"
            alt="Martin Photography"
        >


        <div class="viewer__meta">

            <span>
                01
            </span>

            <span>
                Martin Photography
            </span>

        </div>

    </div>

</div>


<script>

(() => {

    /* ==================================================
       WEBGL LIQUID REVEAL
    ================================================== */

    const hero =
        document.querySelector(
            ".hero"
        );


    const canvas =
        document.getElementById(
            "heroReveal"
        );


    const hint =
        document.getElementById(
            "hint"
        );


    const PAPER = [

        0xf3 / 255,

        0xf3 / 255,

        0xee / 255

    ];


    const INK = [

        0x0b / 255,

        0x0b / 255,

        0x0b / 255

    ];


    const TRAIL_SCALE =
        .35;


    const DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const reduceMotion =
        window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;


    let W =
        1;


    let H =
        1;


    let baseRadius =
        60;


    const textCanvas =
        document.createElement(
            "canvas"
        );


    const textCtx =
        textCanvas.getContext(
            "2d"
        );


    const trailCanvas =
        document.createElement(
            "canvas"
        );


    const trailCtx =
        trailCanvas.getContext(
            "2d"
        );


    const pointer = {

        active:
            false,

        x:
            0,

        y:
            0,

        px:
            0,

        py:
            0,

        vx:
            0,

        vy:
            0

    };


    let droplets =
        [];


    let lastMove =
        performance.now();


    function clamp(
        value,
        min,
        max
    ) {

        return Math.max(
            min,
            Math.min(
                max,
                value
            )
        );

    }


    function stamp(
        x,
        y,
        radius,
        vx,
        vy,
        alpha
    ) {

        const sx =
            x *
            TRAIL_SCALE;


        const sy =
            y *
            TRAIL_SCALE;


        const sr =
            Math.max(
                1,
                radius *
                TRAIL_SCALE
            );


        const k =
            .012;


        const red =
            Math.round(

                128 +

                clamp(
                    vx * k,
                    -1,
                    1
                ) *

                127

            );


        const green =
            Math.round(

                128 +

                clamp(
                    vy * k,
                    -1,
                    1
                ) *

                127

            );


        const gradient =
            trailCtx
            .createRadialGradient(

                sx,
                sy,
                0,

                sx,
                sy,
                sr

            );


        gradient.addColorStop(

            0,

            `rgba(${red},${green},0,${alpha})`

        );


        gradient.addColorStop(

            .5,

            `rgba(${red},${green},0,${alpha * .85})`

        );


        gradient.addColorStop(

            1,

            `rgba(${red},${green},0,0)`

        );


        trailCtx.fillStyle =
            gradient;


        trailCtx.beginPath();


        trailCtx.arc(
            sx,
            sy,
            sr,
            0,
            Math.PI * 2
        );


        trailCtx.fill();

    }


    function updateTrail(
        dt
    ) {

        const frame =
            dt *
            60;


        trailCtx.globalCompositeOperation =
            "destination-out";


        trailCtx.fillStyle =
            `rgba(0,0,0,${
                1 -
                Math.pow(
                    1 - .03,
                    frame
                )
            })`;


        trailCtx.fillRect(

            0,
            0,

            trailCanvas.width,
            trailCanvas.height

        );


        trailCtx.globalCompositeOperation =
            "source-over";


        if (
            pointer.active
        ) {

            const dx =
                pointer.x -
                pointer.px;


            const dy =
                pointer.y -
                pointer.py;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance >
                .5
            ) {

                pointer.vx +=

                    (
                        dx /
                        Math.max(
                            frame,
                            .001
                        )

                        -

                        pointer.vx

                    ) *

                    .5;


                pointer.vy +=

                    (
                        dy /
                        Math.max(
                            frame,
                            .001
                        )

                        -

                        pointer.vy

                    ) *

                    .5;


                const speed =
                    Math.hypot(
                        pointer.vx,
                        pointer.vy
                    );


                const radius =

                    baseRadius *

                    (
                        .75 +

                        Math.min(
                            speed / 45,
                            1
                        ) *

                        .75
                    );


                const steps =
                    Math.max(

                        1,

                        Math.ceil(

                            distance /

                            (
                                radius *
                                .22
                            )

                        )

                    );


                for (
                    let i = 1;
                    i <= steps;
                    i++
                ) {

                    const t =
                        i /
                        steps;


                    stamp(

                        pointer.px +
                        dx * t,

                        pointer.py +
                        dy * t,

                        radius,

                        pointer.vx *
                        6,

                        pointer.vy *
                        6,

                        .92

                    );

                }


                if (
                    !reduceMotion
                ) {

                    const count =
                        Math.min(

                            3,

                            Math.floor(
                                speed /
                                14
                            )

                        );


                    for (
                        let i = 0;
                        i < count;
                        i++
                    ) {

                        const angle =

                            Math.atan2(
                                pointer.vy,
                                pointer.vx
                            )

                            +

                            (
                                Math.random()
                                -
                                .5
                            ) *

                            1.4;


                        const dropSpeed =

                            speed *

                            (
                                .35 +

                                Math.random() *

                                .45
                            );


                        droplets.push({

                            x:

                                pointer.x +

                                (
                                    Math.random()
                                    -
                                    .5
                                ) *

                                radius,


                            y:

                                pointer.y +

                                (
                                    Math.random()
                                    -
                                    .5
                                ) *

                                radius,


                            vx:

                                Math.cos(
                                    angle
                                ) *

                                dropSpeed,


                            vy:

                                Math.sin(
                                    angle
                                ) *

                                dropSpeed,


                            radius:

                                radius *

                                (
                                    .20 +

                                    Math.random() *

                                    .35
                                ),


                            life:
                                1

                        });

                    }


                    if (
                        droplets.length >
                        90
                    ) {

                        droplets.splice(

                            0,

                            droplets.length
                            -
                            90

                        );

                    }

                }


                pointer.px =
                    pointer.x;


                pointer.py =
                    pointer.y;

            }

            else {

                pointer.vx *=
                    .8;


                pointer.vy *=
                    .8;

            }

        }


        for (
            let i =
                droplets.length - 1;

            i >= 0;

            i--
        ) {

            const drop =
                droplets[i];


            drop.x +=
                drop.vx *
                frame;


            drop.y +=
                drop.vy *
                frame;


            drop.vx *=
                Math.pow(
                    .90,
                    frame
                );


            drop.vy =

                drop.vy *

                Math.pow(
                    .90,
                    frame
                )

                +

                .25 *
                frame;


            drop.life -=
                .022 *
                frame;


            drop.radius *=
                Math.pow(
                    .985,
                    frame
                );


            if (
                drop.life <= 0
                ||
                drop.radius < 2
            ) {

                droplets.splice(
                    i,
                    1
                );


                continue;

            }


            stamp(

                drop.x,

                drop.y,

                drop.radius,

                drop.vx *
                6,

                drop.vy *
                6,

                .85 *
                drop.life

            );

        }

    }


    function onMove(
        x,
        y
    ) {

        if (
            !pointer.active
        ) {

            pointer.active =
                true;


            pointer.x =
                x;


            pointer.y =
                y;


            pointer.px =
                x;


            pointer.py =
                y;

        }

        else {

            pointer.x =
                x;


            pointer.y =
                y;

        }


        lastMove =
            performance.now();


        hint
        .classList
        .add(
            "is-gone"
        );


        wake();

    }


    hero.addEventListener(

        "pointermove",

        event => {

            if (
                event.pointerType ===
                "touch"
            ) {

                return;

            }


            const rect =
                hero
                .getBoundingClientRect();


            onMove(

                event.clientX
                -
                rect.left,

                event.clientY
                -
                rect.top

            );

        }

    );


    hero.addEventListener(

        "pointerleave",

        event => {

            if (
                event.pointerType !==
                "touch"
            ) {

                pointer.active =
                    false;

            }

        }

    );


    hero.addEventListener(

        "touchstart",

        event => {

            const touch =
                event.touches[0];


            if (!touch) {
                return;
            }


            const rect =
                hero
                .getBoundingClientRect();


            const x =
                touch.clientX
                -
                rect.left;


            const y =
                touch.clientY
                -
                rect.top;


            pointer.active =
                true;


            pointer.x =
                pointer.px =
                x;


            pointer.y =
                pointer.py =
                y;


            stamp(

                x,
                y,

                baseRadius *
                1.1,

                0,
                0,

                .95

            );


            lastMove =
                performance.now();


            hint
            .classList
            .add(
                "is-gone"
            );


            wake();

        },

        {
            passive:
                true
        }

    );


    hero.addEventListener(

        "touchmove",

        event => {

            const touch =
                event.touches[0];


            if (!touch) {
                return;
            }


            const rect =
                hero
                .getBoundingClientRect();


            onMove(

                touch.clientX
                -
                rect.left,

                touch.clientY
                -
                rect.top

            );

        },

        {
            passive:
                true
        }

    );


    hero.addEventListener(

        "touchend",

        () => {

            pointer.active =
                false;

        },

        {
            passive:
                true
        }

    );


    /* ==================================================
       WEBGL
    ================================================== */

    const gl =
        canvas.getContext(

            "webgl",

            {
                premultipliedAlpha:
                    true,

                alpha:
                    true,

                antialias:
                    false,

                depth:
                    false
            }

        );


    if (!gl) {

        console.warn(
            "WebGL unavailable"
        );

    }

    else {


        const vertexSource = `

            attribute vec2 aPos;

            varying vec2 vUv;


            void main() {

                vUv =
                    vec2(

                        aPos.x
                        *
                        .5
                        +
                        .5,

                        .5
                        -
                        aPos.y
                        *
                        .5

                    );


                gl_Position =
                    vec4(
                        aPos,
                        0.0,
                        1.0
                    );

            }

        `;


        const fragmentSource = `

            precision highp float;


            varying vec2 vUv;


            uniform sampler2D uText;

            uniform sampler2D uTrail;

            uniform vec2 uRes;

            uniform vec3 uPaper;

            uniform vec3 uInk;

            uniform float uTime;


            vec3 mod289(vec3 x) {

                return x
                -
                floor(
                    x *
                    (
                        1.0 /
                        289.0
                    )
                )
                *
                289.0;

            }


            vec4 mod289(vec4 x) {

                return x
                -
                floor(
                    x *
                    (
                        1.0 /
                        289.0
                    )
                )
                *
                289.0;

            }


            vec4 permute(vec4 x) {

                return mod289(

                    (
                        (
                            x *
                            34.0
                        )
                        +
                        1.0
                    )
                    *
                    x

                );

            }


            vec4 taylorInvSqrt(vec4 r) {

                return

                    1.79284291400159

                    -

                    0.85373472095314
                    *
                    r;

            }


            float snoise(vec3 v) {

                const vec2 C =
                    vec2(
                        1.0 / 6.0,
                        1.0 / 3.0
                    );


                const vec4 D =
                    vec4(
                        0.0,
                        0.5,
                        1.0,
                        2.0
                    );


                vec3 i =

                    floor(

                        v

                        +

                        dot(
                            v,
                            C.yyy
                        )

                    );


                vec3 x0 =

                    v

                    -

                    i

                    +

                    dot(
                        i,
                        C.xxx
                    );


                vec3 g =

                    step(
                        x0.yzx,
                        x0.xyz
                    );


                vec3 l =
                    1.0
                    -
                    g;


                vec3 i1 =

                    min(
                        g.xyz,
                        l.zxy
                    );


                vec3 i2 =

                    max(
                        g.xyz,
                        l.zxy
                    );


                vec3 x1 =

                    x0
                    -
                    i1
                    +
                    C.xxx;


                vec3 x2 =

                    x0
                    -
                    i2
                    +
                    C.yyy;


                vec3 x3 =

                    x0
                    -
                    D.yyy;


                i =
                    mod289(i);


                vec4 p =

                    permute(

                        permute(

                            permute(

                                i.z

                                +

                                vec4(
                                    0.0,
                                    i1.z,
                                    i2.z,
                                    1.0
                                )

                            )

                            +

                            i.y

                            +

                            vec4(
                                0.0,
                                i1.y,
                                i2.y,
                                1.0
                            )

                        )

                        +

                        i.x

                        +

                        vec4(
                            0.0,
                            i1.x,
                            i2.x,
                            1.0
                        )

                    );


                float n_ =
                    0.142857142857;


                vec3 ns =

                    n_
                    *
                    D.wyz

                    -

                    D.xzx;


                vec4 j =

                    p

                    -

                    49.0

                    *

                    floor(

                        p

                        *

                        ns.z

                        *

                        ns.z

                    );


                vec4 x_ =
                    floor(
                        j *
                        ns.z
                    );


                vec4 y_ =
                    floor(
                        j
                        -
                        7.0
                        *
                        x_
                    );


                vec4 x =
                    x_
                    *
                    ns.x
                    +
                    ns.yyyy;


                vec4 y =
                    y_
                    *
                    ns.x
                    +
                    ns.yyyy;


                vec4 h =
                    1.0
                    -
                    abs(x)
                    -
                    abs(y);


                vec4 b0 =
                    vec4(
                        x.xy,
                        y.xy
                    );


                vec4 b1 =
                    vec4(
                        x.zw,
                        y.zw
                    );


                vec4 s0 =
                    floor(b0)
                    *
                    2.0
                    +
                    1.0;


                vec4 s1 =
                    floor(b1)
                    *
                    2.0
                    +
                    1.0;


                vec4 sh =
                    -step(
                        h,
                        vec4(0.0)
                    );


                vec4 a0 =

                    b0.xzyw

                    +

                    s0.xzyw

                    *

                    sh.xxyy;


                vec4 a1 =

                    b1.xzyw

                    +

                    s1.xzyw

                    *

                    sh.zzww;


                vec3 p0 =
                    vec3(
                        a0.xy,
                        h.x
                    );


                vec3 p1 =
                    vec3(
                        a0.zw,
                        h.y
                    );


                vec3 p2 =
                    vec3(
                        a1.xy,
                        h.z
                    );


                vec3 p3 =
                    vec3(
                        a1.zw,
                        h.w
                    );


                vec4 norm =

                    taylorInvSqrt(

                        vec4(

                            dot(
                                p0,
                                p0
                            ),

                            dot(
                                p1,
                                p1
                            ),

                            dot(
                                p2,
                                p2
                            ),

                            dot(
                                p3,
                                p3
                            )

                        )

                    );


                p0 *=
                    norm.x;


                p1 *=
                    norm.y;


                p2 *=
                    norm.z;


                p3 *=
                    norm.w;


                vec4 m =

                    max(

                        0.6

                        -

                        vec4(

                            dot(
                                x0,
                                x0
                            ),

                            dot(
                                x1,
                                x1
                            ),

                            dot(
                                x2,
                                x2
                            ),

                            dot(
                                x3,
                                x3
                            )

                        ),

                        0.0

                    );


                m =
                    m *
                    m;


                return

                    42.0

                    *

                    dot(

                        m *
                        m,

                        vec4(

                            dot(
                                p0,
                                x0
                            ),

                            dot(
                                p1,
                                x1
                            ),

                            dot(
                                p2,
                                x2
                            ),

                            dot(
                                p3,
                                x3
                            )

                        )

                    );

            }


            void main() {

                vec2 uv =
                    vUv;


                vec2 asp =
                    vec2(
                        uRes.x /
                        uRes.y,
                        1.0
                    );


                float n1 =

                    snoise(

                        vec3(

                            uv *
                            asp *
                            2.6,

                            uTime *
                            .35

                        )

                    );


                float n2 =

                    snoise(

                        vec3(

                            uv *
                            asp *
                            2.6

                            +

                            17.3,

                            uTime *
                            .35

                        )

                    );


                vec4 trail =

                    texture2D(

                        uTrail,

                        uv

                        +

                        vec2(
                            n1,
                            n2
                        )

                        *

                        .018

                    );


                float mask =

                    trail.a

                    +

                    snoise(

                        vec3(

                            uv *
                            asp *
                            7.0,

                            uTime *
                            .6

                        )

                    )

                    *

                    .05;


                float hole =

                    smoothstep(
                        .40,
                        .47,
                        mask
                    );


                vec2 velocity =

                    (
                        trail.rg
                        -
                        .5
                    )

                    *

                    2.0;


                float drag =

                    smoothstep(
                        .03,
                        .42,
                        trail.a
                    );


                vec2 smearUV =

                    uv

                    -

                    velocity

                    *

                    drag

                    *

                    vec2(

                        .12 /
                        asp.x,

                        .12

                    );


                float ink =

                    texture2D(
                        uText,
                        smearUV
                    ).a;


                vec3 colour =

                    mix(
                        uPaper,
                        uInk,
                        ink
                    );


                float alpha =
                    1.0
                    -
                    hole;


                gl_FragColor =

                    vec4(

                        colour
                        *
                        alpha,

                        alpha

                    );

            }

        `;


        function shader(
            type,
            source
        ) {

            const result =
                gl.createShader(
                    type
                );


            gl.shaderSource(
                result,
                source
            );


            gl.compileShader(
                result
            );


            if (

                !gl.getShaderParameter(

                    result,

                    gl.COMPILE_STATUS

                )

            ) {

                console.error(
                    gl.getShaderInfoLog(
                        result
                    )
                );

            }


            return result;

        }


        const program =
            gl.createProgram();


        gl.attachShader(

            program,

            shader(

                gl.VERTEX_SHADER,

                vertexSource

            )

        );


        gl.attachShader(

            program,

            shader(

                gl.FRAGMENT_SHADER,

                fragmentSource

            )

        );


        gl.linkProgram(
            program
        );


        if (

            !gl.getProgramParameter(

                program,

                gl.LINK_STATUS

            )

        ) {

            console.error(
                gl.getProgramInfoLog(
                    program
                )
            );

        }

        else {


            gl.useProgram(
                program
            );


            const buffer =
                gl.createBuffer();


            gl.bindBuffer(
                gl.ARRAY_BUFFER,
                buffer
            );


            gl.bufferData(

                gl.ARRAY_BUFFER,

                new Float32Array([

                    -1,-1,

                     1,-1,

                    -1, 1,

                     1, 1

                ]),

                gl.STATIC_DRAW

            );


            const aPos =
                gl.getAttribLocation(
                    program,
                    "aPos"
                );


            gl.enableVertexAttribArray(
                aPos
            );


            gl.vertexAttribPointer(

                aPos,

                2,

                gl.FLOAT,

                false,

                0,

                0

            );


            function makeTexture(
                unit
            ) {

                const texture =
                    gl.createTexture();


                gl.activeTexture(

                    gl.TEXTURE0
                    +
                    unit

                );


                gl.bindTexture(
                    gl.TEXTURE_2D,
                    texture
                );


                gl.texParameteri(

                    gl.TEXTURE_2D,

                    gl.TEXTURE_WRAP_S,

                    gl.CLAMP_TO_EDGE

                );


                gl.texParameteri(

                    gl.TEXTURE_2D,

                    gl.TEXTURE_WRAP_T,

                    gl.CLAMP_TO_EDGE

                );


                gl.texParameteri(

                    gl.TEXTURE_2D,

                    gl.TEXTURE_MIN_FILTER,

                    gl.LINEAR

                );


                gl.texParameteri(

                    gl.TEXTURE_2D,

                    gl.TEXTURE_MAG_FILTER,

                    gl.LINEAR

                );


                return texture;

            }


            const textTexture =
                makeTexture(0);


            const trailTexture =
                makeTexture(1);


            gl.uniform1i(

                gl.getUniformLocation(
                    program,
                    "uText"
                ),

                0

            );


            gl.uniform1i(

                gl.getUniformLocation(
                    program,
                    "uTrail"
                ),

                1

            );


            gl.uniform3fv(

                gl.getUniformLocation(
                    program,
                    "uPaper"
                ),

                PAPER

            );


            gl.uniform3fv(

                gl.getUniformLocation(
                    program,
                    "uInk"
                ),

                INK

            );


            const uRes =
                gl.getUniformLocation(
                    program,
                    "uRes"
                );


            const uTime =
                gl.getUniformLocation(
                    program,
                    "uTime"
                );


            gl.pixelStorei(

                gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,

                false

            );


            gl.enable(
                gl.BLEND
            );


            gl.blendFunc(

                gl.ONE,

                gl.ONE_MINUS_SRC_ALPHA

            );


            hero
            .classList
            .add(
                "gl-on"
            );


            function drawText() {

                textCtx.clearRect(

                    0,
                    0,

                    textCanvas.width,
                    textCanvas.height

                );


                textCtx.setTransform(

                    DPR,
                    0,
                    0,
                    DPR,
                    0,
                    0

                );


                let fontSize =

                    Math.min(

                        W *
                        .23,

                        H *
                        .32

                    );


                textCtx.font =

                    `800 ${fontSize}px Outfit, "Arial Black", sans-serif`;


                let metrics =
                    textCtx.measureText(
                        "MARTIN"
                    );


                const maxWidth =
                    W *
                    .90;


                if (
                    metrics.width >
                    maxWidth
                ) {

                    fontSize *=

                        maxWidth
                        /
                        metrics.width;


                    textCtx.font =

                        `800 ${fontSize}px Outfit, "Arial Black", sans-serif`;

                }


                textCtx.textAlign =
                    "center";


                textCtx.textBaseline =
                    "middle";


                textCtx.fillStyle =
                    "#ffffff";


                textCtx.fillText(

                    "MARTIN",

                    W /
                    2,

                    H /
                    2

                );


                gl.activeTexture(
                    gl.TEXTURE0
                );


                gl.bindTexture(

                    gl.TEXTURE_2D,

                    textTexture

                );


                gl.texImage2D(

                    gl.TEXTURE_2D,

                    0,

                    gl.RGBA,

                    gl.RGBA,

                    gl.UNSIGNED_BYTE,

                    textCanvas

                );

            }


            function resize() {

                W =
                    hero.clientWidth;


                H =
                    hero.clientHeight;


                canvas.width =

                    Math.max(

                        2,

                        Math.round(
                            W *
                            DPR
                        )

                    );


                canvas.height =

                    Math.max(

                        2,

                        Math.round(
                            H *
                            DPR
                        )

                    );


                textCanvas.width =
                    canvas.width;


                textCanvas.height =
                    canvas.height;


                trailCanvas.width =

                    Math.max(

                        2,

                        Math.round(

                            W *
                            TRAIL_SCALE

                        )

                    );


                trailCanvas.height =

                    Math.max(

                        2,

                        Math.round(

                            H *
                            TRAIL_SCALE

                        )

                    );


                baseRadius =

                    Math.max(
                        W,
                        H
                    )

                    *

                    (
                        W <
                        768

                        ?

                        .085

                        :

                        .055
                    );


                gl.viewport(

                    0,
                    0,

                    canvas.width,
                    canvas.height

                );


                gl.uniform2f(

                    uRes,

                    W,

                    H

                );


                drawText();


                draw();

            }


            function draw() {

                gl.clearColor(
                    0,
                    0,
                    0,
                    0
                );


                gl.clear(
                    gl.COLOR_BUFFER_BIT
                );


                gl.activeTexture(
                    gl.TEXTURE1
                );


                gl.bindTexture(

                    gl.TEXTURE_2D,

                    trailTexture

                );


                gl.texImage2D(

                    gl.TEXTURE_2D,

                    0,

                    gl.RGBA,

                    gl.RGBA,

                    gl.UNSIGNED_BYTE,

                    trailCanvas

                );


                gl.uniform1f(

                    uTime,

                    performance.now()
                    /
                    1000

                );


                gl.drawArrays(

                    gl.TRIANGLE_STRIP,

                    0,

                    4

                );

            }


            let running =
                false;


            let last =
                performance.now();


            let visible =
                true;


            window.wake =
                wake;


            function wake() {

                if (
                    running
                    ||
                    !visible
                ) {

                    return;

                }


                running =
                    true;


                last =
                    performance.now();


                requestAnimationFrame(
                    tick
                );

            }


            function tick(
                now
            ) {

                if (
                    !running
                ) {

                    return;

                }


                const dt =
                    clamp(

                        (
                            now
                            -
                            last
                        )

                        /

                        1000,

                        .001,

                        .05

                    );


                last =
                    now;


                updateTrail(
                    dt
                );


                draw();


                if (

                    now
                    -
                    lastMove
                    >
                    4500

                    &&

                    droplets.length
                    ===
                    0

                    &&

                    !pointer.active

                ) {

                    running =
                        false;


                    trailCtx.clearRect(

                        0,
                        0,

                        trailCanvas.width,
                        trailCanvas.height

                    );


                    draw();


                    return;

                }


                requestAnimationFrame(
                    tick
                );

            }


            const observer =

                new IntersectionObserver(

                    entries => {

                        visible =

                            entries[0]
                            .isIntersecting;


                        if (
                            visible
                        ) {

                            wake();

                        }

                    }

                );


            observer.observe(
                hero
            );


            window.addEventListener(

                "resize",

                resize

            );


            resize();


            if (

                document.fonts
                &&
                document.fonts.load

            ) {

                document.fonts

                .load(
                    "800 100px Outfit"
                )

                .then(
                    () => {

                        drawText();

                        draw();

                    }
                );

            }


            wake();

        }

    }


    /* ==================================================
       COMPUTER → PHOTO
    ================================================== */

    const computer =
        document.getElementById(
            "computerButton"
        );


    const viewer =
        document.getElementById(
            "viewer"
        );


    const closeViewer =
        document.getElementById(
            "closeViewer"
        );


    function openPhoto() {

        computer
        .classList
        .add(
            "opening"
        );


        setTimeout(
            () => {

                viewer
                .classList
                .add(
                    "open"
                );


                document.body.style.overflow =
                    "hidden";


                computer
                .classList
                .remove(
                    "opening"
                );

            },

            430

        );

    }


    function closePhoto() {

        viewer
        .classList
        .remove(
            "open"
        );


        document.body.style.overflow =
            "";

    }


    computer.addEventListener(
        "click",
        openPhoto
    );


    closeViewer.addEventListener(
        "click",
        closePhoto
    );


    viewer.addEventListener(

        "click",

        event => {

            if (
                event.target ===
                viewer
            ) {

                closePhoto();

            }

        }

    );


    document.addEventListener(

        "keydown",

        event => {

            if (
                event.key ===
                "Escape"
            ) {

                closePhoto();

            }

        }

    );

})();

</script>
