<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Martin Photography</title>

    <meta
        name="description"
        content="Martin Photography — Moments through my perspective."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Outfit:wght@800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --paper: #f3f3ee;
            --ink: #0b0b0b;

            --body:
                "Inter Tight",
                Arial,
                sans-serif;

            --display:
                "Outfit",
                "Arial Black",
                sans-serif;
        }


        * {
            box-sizing: border-box;
        }


        html {
            margin: 0;
            padding: 0;

            scroll-behavior: smooth;

            background: var(--paper);
        }


        body {
            margin: 0;
            padding: 0;

            width: 100%;

            background: var(--paper);

            color: var(--ink);

            font-family: var(--body);

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
        }


        a {
            color: inherit;

            text-decoration: none;
        }


        button {
            font-family: inherit;
        }


        /* ==========================================
           HOME
        ========================================== */

        .hero {
            position: relative;

            width: 100%;

            height: 100vh;
            height: 100svh;

            min-height: 620px;

            overflow: hidden;

            background: var(--paper);

            isolation: isolate;

            touch-action: pan-y;
        }


        /* PHOTO UNDER MARTIN */

        .hero-photo {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            z-index: 0;

            pointer-events: none;
        }


        /* CANVAS PAPER */

        #revealCanvas {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            z-index: 1;

            pointer-events: none;
        }


        /* HOME UI */

        .home-ui {
            position: absolute;

            inset: 0;

            z-index: 3;

            padding:
                max(28px, env(safe-area-inset-top))
                30px
                max(28px, env(safe-area-inset-bottom));

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            pointer-events: none;

            mix-blend-mode: difference;

            color: white;
        }


        .home-ui a {
            pointer-events: auto;
        }


        .intro {
            max-width: 500px;
        }


        .intro p {
            margin: 0;

            font-size: clamp(20px, 2vw, 30px);

            line-height: 1.02;

            letter-spacing: -0.03em;
        }


        .cta {
            display: inline-flex;

            align-items: center;

            gap: 14px;

            margin-top: 30px;

            padding: 16px 26px;

            border-radius: 999px;

            background: white;

            color: black;

            font-size: 13px;

            font-weight: 500;

            letter-spacing: 0.08em;

            text-transform: uppercase;

            transition:
                transform .3s ease;
        }


        .cta:hover {
            transform: translateY(-3px);
        }


        .cta:active {
            transform: scale(.97);
        }


        .cta svg {
            width: 16px;
            height: 16px;
        }


        .home-footer {
            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            gap: 20px;

            font-size: 12px;

            line-height: 1.2;
        }


        .socials {
            display: flex;

            gap: 10px;

            align-items: center;

            text-transform: uppercase;

            letter-spacing: .06em;
        }


        .socials a:hover {
            text-decoration: underline;

            text-underline-offset: 4px;
        }


        .reveal-hint {
            position: absolute;

            left: 50%;

            bottom: 30px;

            transform: translateX(-50%);

            margin: 0;

            font-size: 11px;

            letter-spacing: .08em;

            text-transform: uppercase;

            opacity: .45;

            transition: opacity .5s ease;
        }


        .reveal-hint.hidden {
            opacity: 0;
        }


        .touch-hint {
            display: none;
        }


        @media (hover: none) {

            .mouse-hint {
                display: none;
            }


            .touch-hint {
                display: inline;
            }

        }


        /* ==========================================
           WHITE VOID / WORK AREA
        ========================================== */

        .work-stage {
            position: relative;

            min-height: 100vh;
            min-height: 100svh;

            background: #ffffff;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 90px 20px;

            overflow: hidden;
        }


        .work-label {
            position: absolute;

            top: 35px;

            left: 35px;

            margin: 0;

            font-size: 11px;

            letter-spacing: .16em;

            text-transform: uppercase;

            color: #777;
        }


        .work-home-link {
            position: absolute;

            top: 35px;

            right: 35px;

            font-size: 11px;

            letter-spacing: .12em;

            text-transform: uppercase;

            color: #555;
        }


        .work-home-link:hover {
            color: #000;
        }


        /* ==========================================
           RETRO COMPUTER
        ========================================== */

        .computer-button {
            border: 0;

            background: transparent;

            padding: 0;

            cursor: pointer;

            transition:
                transform .55s
                cubic-bezier(.2,.8,.2,1);

            outline: none;
        }


        .computer-button:hover {
            transform:
                translateY(-10px)
                scale(1.025);
        }


        .computer-button:active {
            transform:
                scale(.98);
        }


        .computer {
            position: relative;

            width: min(72vw, 430px);

            filter:
                drop-shadow(
                    0 30px 28px
                    rgba(0,0,0,.10)
                );
        }


        .monitor {
            position: relative;

            width: 78%;

            height: 355px;

            margin: 0 auto;

            background:
                linear-gradient(
                    145deg,
                    #eee4ce,
                    #d8c8ab
                );

            border:
                2px solid
                #bcaa8e;

            border-radius:
                18px 18px 11px 11px;
        }


        .monitor::after {
            content: "";

            position: absolute;

            inset: 7px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,.5);

            pointer-events: none;
        }


        .screen-frame {
            position: absolute;

            top: 35px;

            left: 50%;

            transform: translateX(-50%);

            width: 72%;
            height: 175px;

            padding: 11px;

            border-radius: 13px;

            background: #313033;
        }


        .screen {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            border-radius: 7px;

            background:
                linear-gradient(
                    #cad5cf,
                    #9facaa
                );

            border:
                2px solid
                #121212;
        }


        .screen-bar {
            height: 18px;

            border-bottom:
                1px solid
                rgba(0,0,0,.2);

            background:
                #dbe1dd;
        }


        .screen-content {
            height:
                calc(100% - 18px);

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                var(--display);

            font-size:
                clamp(
                    24px,
                    5vw,
                    38px
                );

            letter-spacing:
                -0.05em;

            color: #171717;
        }


        .disk-slot {
            position: absolute;

            right: 32px;

            top: 245px;

            width: 78px;
            height: 11px;

            border-radius: 2px;

            background:
                #796d5b;
        }


        .computer-logo {
            position: absolute;

            left: 24px;

            bottom: 27px;

            width: 13px;
            height: 13px;

            background:
                #cdbb9f;

            border:
                1px solid
                #ad9a7d;
        }


        .computer-neck {
            width: 69%;
            height: 16px;

            margin: 0 auto;

            background:
                #d2c0a2;

            border-left:
                2px solid
                #b6a386;

            border-right:
                2px solid
                #b6a386;
        }


        .keyboard {
            position: relative;

            width: 100%;

            height: 105px;

            padding: 18px 22px;

            background:
                linear-gradient(
                    145deg,
                    #e8ddc6,
                    #d4c2a4
                );

            border:
                2px solid
                #baa788;

            border-radius: 10px;

            transform:
                perspective(500px)
                rotateX(4deg);

            transform-origin: top;
        }


        .keys {
            display: grid;

            grid-template-columns:
                repeat(12,1fr);

            gap: 5px;
        }


        .key {
            height: 18px;

            border-radius: 2px;

            background:
                linear-gradient(
                    #8b7c65,
                    #645744
                );

            border:
                1px solid
                #4e4438;
        }


        .spacebar {
            grid-column:
                span 5;
        }


        .computer-mouse {
            position: absolute;

            right: -85px;

            bottom: 5px;

            width: 60px;
            height: 72px;

            background:
                #ddceb5;

            border:
                2px solid
                #baa88a;

            border-radius: 10px;
        }


        .computer-mouse::before {
            content: "";

            position: absolute;

            top: 10px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 26px;

            border-top:
                2px solid
                #b5a184;
        }


        .computer-cable {
            position: absolute;

            left: -70px;

            bottom: 80px;

            width: 100px;
            height: 70px;

            border-left:
                7px solid
                #a99066;

            border-bottom:
                7px solid
                #a99066;

            border-radius:
                0 0 0 70px;

            transform:
                rotate(-10deg);
        }


        .computer-caption {
            margin-top: 32px;

            font-size: 11px;

            letter-spacing: .14em;

            text-transform: uppercase;

            color: #777;
        }


        /* ==========================================
           COMPUTER OPEN ANIMATION
        ========================================== */

        .computer-button.opening {
            transform:
                scale(1.18)
                translateY(-5px);

            pointer-events: none;
        }


        /* ==========================================
           PHOTO VIEWER
        ========================================== */

        .photo-viewer {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .98
                );

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity .55s ease,
                visibility .55s ease;
        }


        .photo-viewer.open {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        .photo-panel {
            position: relative;

            width:
                min(
                    1100px,
                    94vw
                );

            max-height: 90vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            transform:
                scale(.83);

            opacity: 0;

            transition:
                transform .7s
                cubic-bezier(.2,.8,.2,1),

                opacity .5s ease;
        }


        .photo-viewer.open
        .photo-panel {
            transform:
                scale(1);

            opacity: 1;
        }


        .photo-panel img {
            display: block;

            max-width: 100%;

            max-height: 78vh;

            width: auto;
            height: auto;

            object-fit: contain;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.13);
        }


        .photo-meta {
            width: 100%;

            display: flex;

            justify-content:
                space-between;

            gap: 20px;

            padding-top: 15px;

            font-size: 11px;

            letter-spacing: .1em;

            text-transform: uppercase;

            color: #666;
        }


        .close-viewer {
            position: fixed;

            top:
                max(
                    24px,
                    env(
                        safe-area-inset-top
                    )
                );

            right: 25px;

            z-index: 1002;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border:
                1px solid
                #222;

            background: white;

            color: #111;

            font-size: 24px;

            cursor: pointer;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .3s ease;
        }


        .photo-viewer.open
        .close-viewer {
            opacity: 1;

            visibility: visible;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (
            max-width: 767px
        ) {

            .hero {
                min-height:
                    100svh;
            }


            .hero-photo {
                object-position:
                    center;
            }


            .home-ui {
                padding:
                    max(
                        30px,
                        env(
                            safe-area-inset-top
                        )
                    )
                    30px
                    max(
                        30px,
                        env(
                            safe-area-inset-bottom
                        )
                    );
            }


            .intro p {
                font-size: 27px;

                max-width: 340px;
            }


            .cta {
                padding:
                    17px 27px;

                font-size: 13px;
            }


            .home-footer {
                font-size: 11px;
            }


            .reveal-hint {
                bottom: 52px;
            }


            .work-label {
                top: 24px;
                left: 20px;
            }


            .work-home-link {
                top: 24px;
                right: 20px;
            }


            .computer {
                width:
                    min(
                        75vw,
                        330px
                    );
            }


            .monitor {
                height: 285px;
            }


            .screen-frame {
                top: 28px;

                height: 140px;
            }


            .disk-slot {
                top: 195px;

                width: 58px;
            }


            .keyboard {
                height: 85px;

                padding:
                    13px 14px;
            }


            .key {
                height: 14px;
            }


            .computer-mouse {
                right: -55px;

                width: 44px;
                height: 55px;
            }


            .computer-cable {
                display: none;
            }


            .photo-viewer {
                padding: 20px;
            }


            .photo-panel img {
                max-height:
                    73vh;
            }

        }

    </style>
</head>


<body>


<!-- ==========================================
     HOME
========================================== -->

<section
    class="hero"
    id="home"
>

    <img
        class="hero-photo"
        src="/static/images/DSC00686-2.JPG"
        alt=""
        aria-hidden="true"
    >


    <canvas
        id="revealCanvas"
        aria-hidden="true"
    ></canvas>


    <div class="home-ui">

        <div class="intro">

            <p>
                Martin Photography.<br>
                Moments through my perspective.
            </p>


            <a
                href="#work"
                class="cta"
            >

                View my work

                <svg
                    viewBox="0 0 16 16"

                >

                    <path

                    />

                </svg>

        </div>


        <div class="home-footer">

            <span>
                Photographer — Martin
            </span>


            <nav class="socials">

                <a href="#">
                    Instagram
                </a>

                <span>/</span>

                <a href="#">
                    Contact
                </a>

            </nav>

        </div>


        <p

            id="revealHint"
        >

            <span

                Move to reveal
            </span>

            <span
                class="touch-hint"
            >
                Touch to reveal
            </span>

        </p>

    </div>

</section>


<!-- ==========================================
     WHITE VOID
========================================== -->

<section
    class="work-stage"
    id="work"
>

    <p class="work-label">
        Martin / Selected Work
    </p>


    <a
        class="work-home-link"
        href="#home"
    >
        Back home
    </a>


    <button
        class="computer-button"
        id="computerButton"
        aria-label="Open Martin's photography"
    >

        <div class="computer">

            <div
                class="computer-cable"
            ></div>


            <div class="monitor">

                <div
                    class="screen-frame"
                >

                    <div
                        class="screen"
                    >

                        <div
                            class="screen-bar"
                        ></div>


                        <div
                            class="screen-content"
                        >
                            MARTIN
                        </div>

                    </div>

                </div>


                <div
                    class="disk-slot"
                ></div>


                <div
                    class="computer-logo"
                ></div>

            </div>


            <div
                class="computer-neck"
            ></div>


            <div class="keyboard">

                <div class="keys">

                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>

                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>

                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>

                    <div
                        class="
                            key
                            spacebar
                        "
                    ></div>

                    <div class="key"></div>
                    <div class="key"></div>
                    <div class="key"></div>

                </div>

            </div>


            <div
                class="computer-mouse"
            ></div>

        </div>

    </button>


    <div
        class="computer-caption"
    >
        Click the computer
    </div>

</section>


<!-- ==========================================
     PHOTO VIEWER
========================================== -->

<div
    class="photo-viewer"
    id="photoViewer"
>

    <button
        class="close-viewer"
        id="closeViewer"
        aria-label="Close photograph"
    >
        ×
    </button>


    <div
        class="photo-panel"
    >

        <img
            src="/static/images/DSC00686-2.JPG"
            alt="Martin Photography"
        >


        <div
            class="photo-meta"
        >

            <span>
                01
            </span>


            <span>
                Martin Photography
            </span>

        </div>

    </div>

</div>


<script>

(() => {

    /* ========================================
       HOME LIQUID REVEAL
    ======================================== */

    const hero =
        document.querySelector(
            ".hero"
        );


    const canvas =
        document.getElementById(
            "revealCanvas"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    const hint =
        document.getElementById(
            "revealHint"
        );


    let width =
        0;


    let height =
        0;


    let dpr =
        1;


    let pointerActive =
        false;


    let pointerX =
        0;


    let pointerY =
        0;


    let previousX =
        0;


    let previousY =
        0;


    let firstMove =
        true;


    let lastTime =
        performance.now();


    const trails =
        [];


    const droplets =
        [];


    function resizeCanvas() {

        const rect =
            hero.getBoundingClientRect();


        width =
            rect.width;


        height =
            rect.height;


        dpr =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );


        canvas.width =
            Math.round(
                width * dpr
            );


        canvas.height =
            Math.round(
                height * dpr
            );


        canvas.style.width =
            width + "px";


        canvas.style.height =
            height + "px";


        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

    }


    function drawPaper() {

        ctx.globalCompositeOperation =
            "source-over";


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        ctx.fillStyle =
            "#f3f3ee";


        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        let fontSize =
            Math.min(
                width * .23,
                height * .31
            );


        ctx.font =
            `800 ${fontSize}px Outfit, Arial Black, sans-serif`;


        const measurement =
            ctx.measureText(
                "MARTIN"
            );


        const maximum =
            width * .90;


        if (
            measurement.width >
            maximum
        ) {

            fontSize *=
                maximum /
                measurement.width;


            ctx.font =
                `800 ${fontSize}px Outfit, Arial Black, sans-serif`;

        }


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillStyle =
            "#0b0b0b";


        ctx.fillText(
            "MARTIN",
            width / 2,
            height / 2
        );

    }


    function hole(
        x,
        y,
        radius,
        life
    ) {

        const wobble =

            1 +

            Math.sin(

                performance.now()
                * .004

                +

                x * .015

                +

                y * .007

            ) *

            .06;


        const r =
            radius *
            wobble;


        const gradient =
            ctx.createRadialGradient(

                x,
                y,
                0,

                x,
                y,
                r

            );


        gradient.addColorStop(
            0,
            `rgba(0,0,0,${Math.min(1,life * 1.5)})`
        );


        gradient.addColorStop(
            .65,
            `rgba(0,0,0,${life})`
        );


        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }


    function localPosition(
        clientX,
        clientY
    ) {

        const rect =
            hero.getBoundingClientRect();


        return {

            x:
                clientX -
                rect.left,

            y:
                clientY -
                rect.top

        };

    }


    function pointerMove(
        x,
        y
    ) {

        if (
            firstMove
        ) {

            previousX =
                x;


            previousY =
                y;


            firstMove =
                false;

        }


        pointerX =
            x;


        pointerY =
            y;


        pointerActive =
            true;


        hint.classList.add(
            "hidden"
        );


        const dx =
            pointerX -
            previousX;


        const dy =
            pointerY -
            previousY;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        const baseRadius =
            Math.max(
                width,
                height
            ) *
            (
                width < 768
                ? .085
                : .055
            );


        const radius =

            baseRadius *

            (
                .9 +

                Math.min(
                    distance / 50,
                    .6
                )
            );


        const steps =
            Math.max(

                1,

                Math.ceil(

                    distance /

                    Math.max(
                        10,
                        radius * .22
                    )

                )

            );


        for (
            let i = 0;
            i <= steps;
            i++
        ) {

            const t =
                i / steps;


            trails.push({

                x:
                    previousX +
                    dx * t,

                y:
                    previousY +
                    dy * t,

                r:
                    radius *
                    (
                        .9 +
                        Math.random() *
                        .18
                    ),

                life: 1

            });

        }


        if (
            distance > 9
        ) {

            const count =
                Math.min(
                    3,
                    Math.floor(
                        distance / 15
                    )
                );


            for (
                let i = 0;
                i < count;
                i++
            ) {

                droplets.push({

                    x:
                        x +
                        (
                            Math.random() -
                            .5
                        ) *
                        radius,

                    y:
                        y +
                        (
                            Math.random() -
                            .5
                        ) *
                        radius,

                    vx:
                        dx *
                        (
                            .04 +
                            Math.random() *
                            .08
                        ),

                    vy:
                        dy *
                        (
                            .04 +
                            Math.random() *
                            .08
                        ),

                    r:
                        radius *
                        (
                            .08 +
                            Math.random() *
                            .15
                        ),

                    life: 1

                });

            }

        }


        if (
            trails.length >
            220
        ) {

            trails.splice(
                0,
                trails.length - 220
            );

        }


        if (
            droplets.length >
            70
        ) {

            droplets.splice(
                0,
                droplets.length - 70
            );

        }


        previousX =
            pointerX;


        previousY =
            pointerY;

    }


    hero.addEventListener(
        "pointermove",
        event => {

            if (
                event.pointerType ===
                "touch"
            ) {

                return;

            }


            const position =
                localPosition(
                    event.clientX,
                    event.clientY
                );


            pointerMove(
                position.x,
                position.y
            );

        }
    );


    hero.addEventListener(
        "pointerleave",
        () => {

            pointerActive =
                false;


            firstMove =
                true;

        }
    );


    hero.addEventListener(
        "touchstart",
        event => {

            const touch =
                event.touches[0];


            if (!touch) {
                return;
            }


            const position =
                localPosition(
                    touch.clientX,
                    touch.clientY
                );


            firstMove =
                true;


            pointerMove(
                position.x,
                position.y
            );


            trails.push({

                x:
                    position.x,

                y:
                    position.y,

                r:
                    Math.max(
                        width,
                        height
                    ) *
                    .09,

                life: 1

            });

        },

        {
            passive: true
        }
    );


    hero.addEventListener(
        "touchmove",
        event => {

            const touch =
                event.touches[0];


            if (!touch) {
                return;
            }


            const position =
                localPosition(
                    touch.clientX,
                    touch.clientY
                );


            pointerMove(
                position.x,
                position.y
            );

        },

        {
            passive: true
        }
    );


    hero.addEventListener(
        "touchend",
        () => {

            pointerActive =
                false;


            firstMove =
                true;

        },

        {
            passive: true
        }
    );


    function animate(
        now
    ) {

        const dt =
            Math.min(
                50,
                now -
                lastTime
            );


        lastTime =
            now;


        drawPaper();


        ctx.globalCompositeOperation =
            "destination-out";


        for (
            let i =
                trails.length - 1;

            i >= 0;

            i--
        ) {

            const trail =
                trails[i];


            trail.life -=
                dt / 1500;


            if (
                trail.life <= 0
            ) {

                trails.splice(
                    i,
                    1
                );


                continue;

            }


            hole(

                trail.x,

                trail.y,

                trail.r,

                trail.life

            );

        }


        for (
            let i =
                droplets.length - 1;

            i >= 0;

            i--
        ) {

            const drop =
                droplets[i];


            drop.x +=
                drop.vx *
                dt *
                .08;


            drop.y +=
                drop.vy *
                dt *
                .08;


            drop.vy +=
                .012 *
                dt;


            drop.vx *=
                .985;


            drop.r *=
                .997;


            drop.life -=
                dt / 1200;


            if (
                drop.life <= 0
                ||
                drop.r < 1
            ) {

                droplets.splice(
                    i,
                    1
                );


                continue;

            }


            hole(

                drop.x,

                drop.y,

                drop.r,

                drop.life

            );

        }


        requestAnimationFrame(
            animate
        );

    }


    resizeCanvas();


    window.addEventListener(
        "resize",
        resizeCanvas
    );


    if (
        document.fonts
        &&
        document.fonts.load
    ) {

        document.fonts
            .load(
                "800 100px Outfit"
            )
            .then(
                () => {
                    drawPaper();
                }
            );

    }


    requestAnimationFrame(
        animate
    );


    /* ========================================
       RETRO COMPUTER → PHOTO
    ======================================== */

    const computerButton =
        document.getElementById(
            "computerButton"
        );


    const viewer =
        document.getElementById(
            "photoViewer"
        );


    const closeViewer =
        document.getElementById(
            "closeViewer"
        );


    function openPhoto() {

        computerButton
            .classList.add(
                "opening"
            );


        setTimeout(
            () => {

                viewer
                    .classList.add(
                        "open"
                    );


                document.body.style.overflow =
                    "hidden";


                computerButton
                    .classList.remove(
                        "opening"
                    );

            },
            420
        );

    }


    function closePhoto() {

        viewer
            .classList.remove(
                "open"
            );


        document.body.style.overflow =
            "";

    }


    computerButton.addEventListener(
        "click",
        openPhoto
    );


    closeViewer.addEventListener(
        "click",
        closePhoto
    );


    viewer.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                viewer
            ) {

                closePhoto();

            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape"
            ) {

                closePhoto();

            }

        }
    );

})();

</script>


</body>

</html>
