{% extends 'auth_base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>LOG IN.</h1>
<p>Welcome back to Martin Photography.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login', next='/forum' if request.args.get('next') == '/forum' else none) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" maxlength="80" value="{{ username }}" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Log in</button>
</form>
<p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
