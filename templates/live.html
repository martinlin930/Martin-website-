<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Live — Martin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#242424;font-family:Arial,sans-serif}main{max-width:1100px;margin:0 auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}a{color:inherit;text-decoration:none}h1{font-size:24px;font-weight:500}video{display:block;width:100%;max-height:70vh;aspect-ratio:16/9;background:#151515;border-radius:20px;object-fit:contain}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{border:0;border-radius:12px;background:#252525;color:#fff;padding:13px 20px;font-size:15px;cursor:pointer}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}#status{color:#666;line-height:1.6}small{color:#777}</style></head><body><main><header><h1>Live</h1><a href="/#work">← 返回电脑</a></header><video id="video" playsinline controls></video><div class="actions">{% if live_admin %}<button id="start">开始直播 · 屏幕与麦克风</button><button id="stop" hidden>结束直播</button><button id="mic" hidden>麦克风：开</button>{% endif %}<button id="watch">观看直播</button><button id="leave" hidden>退出观看</button></div><p id="status" role="status">正在查看直播状态…</p>{% if live_admin %}<small>请用电脑浏览器开始屏幕共享。直播结束后，屏幕与麦克风会自动关闭。</small>{% endif %}</main><script type="module" src="/static/live.js"></script></body></html>
