*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#242424;font-family:Arial,sans-serif}main{max-width:1100px;margin:0 auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}a{color:inherit;text-decoration:none}h1{font-size:24px;font-weight:500}.stage{position:relative;width:100%;background:#111;border-radius:20px;overflow:hidden}.stage video{display:block;width:100%;height:min(70vh,calc((100vw - 40px)*.5625));min-height:260px;aspect-ratio:16/9;background:#111;object-fit:contain}.stage:fullscreen{width:100vw;height:100vh;border-radius:0;display:grid;place-items:center}.stage:fullscreen video{height:100vh;max-height:100vh;width:100vw}.stage.expanded{position:fixed;z-index:9999;inset:0;border-radius:0;display:grid;place-items:center}.stage.expanded video{height:100vh;max-height:100vh;width:100vw}.video-tools{position:absolute;right:14px;top:14px;display:flex;gap:8px}.video-tools button{background:#111c;backdrop-filter:blur(8px);padding:10px 14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{border:0;border-radius:12px;background:#252525;color:#fff;padding:13px 20px;font-size:15px;cursor:pointer}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}#status{color:#666;line-height:1.6}small{color:#777}</style></head><body><main><header><h1>Live</h1><a href="/#work">← 返回电脑</a></header><div class="stage" id="stage"><video id="video" playsinline autoplay muted></video><div class="video-tools"><button id="sound" hidden>开启声音</button><button id="fullscreen">⛶ 放大</button></div></div><div class="actions">{% if live_admin %}<button id="start">开始直播 · 屏幕声音 + 麦克风</button><button id="stop" hidden>结束直播</button><button id="mic" hidden>麦克风：开</button>{% endif %}<button id="watch">观看直播</button><button id="leave" hidden>退出观看</button></div><p id="status" role="status">正在查看直播状态…</p>{% if live_admin %}<small>请用电脑 Chrome 开始共享；选择 YouTube 所在标签页并允许分享标签页音频，观众就能听到电脑声音。你的麦克风也会一起直播。</small>{%
