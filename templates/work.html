<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Work — Martin Photography</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f3ee;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 5%;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: #111;
            text-decoration: none;
            font-size: 13px;
        }

        .intro {
            padding: 80px 5% 100px;
        }

        .intro p {
            font-size: 13px;
            letter-spacing: 3px;
        }

        .intro h1 {
            font-size: clamp(70px, 13vw, 180px);
            line-height: 0.85;
            margin: 20px 0 0;
            letter-spacing: -6px;
        }

        .gallery {
            padding: 0 5% 100px;
        }

        .photo {
            margin-bottom: 100px;
        }

        .photo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .photo-info {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 12px;
            color: #555;
        }

        footer {
            padding: 50px 5%;
            border-top: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">MARTIN.</div>
        <a href="/">BACK HOME</a>
    </nav>

    <section class="intro">
        <p>SELECTED PHOTOGRAPHY</p>
        <h1>MY<br>WORK.</h1>
    </section>

    <section class="gallery">

        <div class="photo">

            <img src="/static/images/DSC00686-2.JPG"
                 alt="Martin Photography">

            <div class="photo-info">
                <span>01</span>
                <span>Photography — Martin</span>
            </div>

        </div>

    </section>

    <footer>
        <span>© 2026 Martin Photography</span>
        <span>Martin</span>
    </footer>

</body>

</html>
