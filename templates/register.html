{% extends 'auth_base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>JOIN US.</h1>
<p>Create your Martin Photography account.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('register', next='/forum' if request.args.get('next') == '/forum' else none) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" maxlength="80" value="{{ username }}" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required>
<p id="password-hint">Use at least 8 characters.</p>
<button type="submit">Create account</button>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
